<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262422" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Journal">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Journal</title>
<link rel="manifest" href="/journal/manifest.webmanifest">
<link rel="icon" href="/journal/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/journal/apple-touch-icon.png">
<script id="theme-init">
(function () {
  try {
    var saved = localStorage.getItem("silurian-notes-theme");
    if (saved === "light" || saved === "dark") { document.documentElement.setAttribute("data-theme", saved); }
  } catch (e) { /* storage is blocked: the page follows the device */ }
})();
</script>
<link rel="stylesheet" href="/tokens.css">
<style>
  /* Light theme and page sizes. The only place a colour or a font size is written. */
  :root {
    color-scheme: light dark;
    --notes-ground: #faf8f5;
    --notes-panel: #f1ede7;
    --notes-field: #ffffff;
    --notes-line: #e2dcd3;
    --notes-line-soft: #ebe6df;
    --notes-hover: #ede8e1;
    --notes-selected: #e4dccf;
    --notes-scrim: rgba(26, 25, 24, 0.4);
    --notes-ink: #2f2d2b;
    --notes-strong: #1a1918;
    --notes-muted: #66615f;
    --notes-icon: #4a4744;
    --notes-accent: #ec6917;
    --notes-on-accent: #1a1918;
    --notes-good: #356b46;
    --notes-warn: #9a5a12;
    --notes-bad: #a52a1f;

    --notes-header-height: 65px;
    --notes-size-12: 12px;
    --notes-size-13: 13px;
    --notes-size-14: 14px;
    --notes-size-15: 15px;
    --notes-size-18: 18px;
    --notes-size-30: 30px;
  }
  :root[data-theme="light"] { color-scheme: light; }

  /* Dark theme, following the device when no choice is saved. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --notes-ground: #262422;
      --notes-panel: #1f1d1c;
      --notes-field: #262422;
      --notes-line: #3a3735;
      --notes-line-soft: #33302e;
      --notes-hover: #302d2b;
      --notes-selected: #3d3936;
      --notes-scrim: rgba(0, 0, 0, 0.6);
      --notes-ink: #e3dfdd;
      --notes-strong: #f5f2ef;
      --notes-muted: #9f9893;
      --notes-icon: #cfcac6;
      --notes-accent: #ec6917;
      --notes-on-accent: #1a1918;
      --notes-good: #6fbf86;
      --notes-warn: #e8a54b;
      --notes-bad: #f0857a;
    }
  }

  /* Dark theme, chosen with the switch. Same values as the block above. */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --notes-ground: #262422;
    --notes-panel: #1f1d1c;
    --notes-field: #262422;
    --notes-line: #3a3735;
    --notes-line-soft: #33302e;
    --notes-hover: #302d2b;
    --notes-selected: #3d3936;
    --notes-scrim: rgba(0, 0, 0, 0.6);
    --notes-ink: #e3dfdd;
    --notes-strong: #f5f2ef;
    --notes-muted: #9f9893;
    --notes-icon: #cfcac6;
    --notes-accent: #ec6917;
    --notes-on-accent: #1a1918;
    --notes-good: #6fbf86;
    --notes-warn: #e8a54b;
    --notes-bad: #f0857a;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--notes-ground);
    color: var(--notes-ink);
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: var(--notes-size-15);
    line-height: 1.5;
  }

  .icon {
    display: block;
    width: 20px;
    height: 20px;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  /* ---------- header ---------- */

  .bar {
    position: sticky;
    top: 0;
    z-index: 30;
    height: var(--notes-header-height);
    background: var(--notes-panel);
    border-bottom: 1px solid var(--notes-line-soft);
  }
  .bar-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px 16px;
    height: 100%;
    padding: 0 16px;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .mark { display: block; width: 26px; height: auto; aspect-ratio: 200 / 290; flex: none; }
  .wordmark {
    margin: 0;
    font-family: "Archivo", system-ui, sans-serif;
    font-size: var(--notes-size-18);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--notes-strong);
    white-space: nowrap;
  }
  .bar-right { display: flex; align-items: center; gap: 8px; }

  /* ---------- buttons ---------- */

  button, a.button-link {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 36px;
    padding: 4px 12px;
    border: 1px solid var(--notes-line);
    border-radius: 8px;
    background: var(--notes-ground);
    color: var(--notes-ink);
    font: inherit;
    font-size: var(--notes-size-14);
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }
  button:hover, a.button-link:hover { background: var(--notes-hover); }
  button.primary {
    border: 0;
    background: var(--notes-accent);
    color: var(--notes-on-accent);
  }
  button.primary:hover { background: var(--notes-accent); filter: brightness(0.92); }
  button.icon-button {
    width: 36px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--notes-icon);
  }
  button.icon-button:hover { background: var(--notes-hover); }
  button.quiet {
    border: 0;
    background: transparent;
  }
  button.quiet:hover { background: var(--notes-hover); }
  button:disabled { cursor: default; opacity: 0.55; }
  /* A touch screen gets 44px targets everywhere a finger lands. */
  @media (pointer: coarse) {
    button, a.button-link { min-height: 44px; }
    button.icon-button { width: 44px; }
  }

  button:focus-visible, input:focus-visible, a:focus-visible,
  .editor-line:focus-visible, .entry-text:focus-visible, .line-text:focus-visible, .quick-editor:focus-visible {
    outline: 2px solid var(--notes-accent);
    outline-offset: 2px;
  }

  /* One icon at a time in the theme switch: the moon on a light page, the sun on a dark one. */
  .theme-switch .icon-sun { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .theme-switch .icon-sun { display: block; }
    :root:not([data-theme="light"]) .theme-switch .icon-moon { display: none; }
  }
  :root[data-theme="dark"] .theme-switch .icon-sun { display: block; }
  :root[data-theme="dark"] .theme-switch .icon-moon { display: none; }

  /* ---------- sign in ---------- */

  main { padding: 24px 16px 48px; }
  .lead { margin: 0 0 16px; color: var(--notes-muted); }
  h1 {
    margin: 0 0 16px;
    font-size: var(--notes-size-30);
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: var(--notes-strong);
  }
  .login-card {
    max-width: 380px;
    padding: 24px;
    border: 1px solid var(--notes-line);
    border-radius: 8px;
    background: var(--notes-panel);
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-size: var(--notes-size-12);
    font-weight: 600;
    color: var(--notes-muted);
  }
  input[type="password"] {
    appearance: none;
    width: 100%;
    min-height: 44px;
    padding: 8px 12px;
    border: 1px solid var(--notes-line);
    border-radius: 8px;
    background: var(--notes-field);
    color: var(--notes-ink);
    font: inherit;
  }
  .form-actions { margin-top: 14px; }
  .message { margin: 0 0 16px; font-weight: 600; color: var(--notes-bad); }

  /* ---------- message bar ---------- */

  .flash {
    position: fixed;
    top: calc(var(--notes-header-height) + 8px);
    left: 0;
    right: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px 12px;
    width: min(620px, calc(100% - 16px));
    margin: 0 auto;
    padding: 4px 4px 4px 12px;
    border: 1px solid var(--notes-line);
    border-radius: 8px;
    background: var(--notes-panel);
  }
  .flash p { margin: 0; padding: 4px 0; }
  .flash-actions { display: flex; flex: none; gap: 4px; }

  /* ---------- panels ---------- */

  #app { min-width: 0; }
  .panels { display: grid; gap: 12px; padding: 12px; }
  .panel {
    container: panel / inline-size;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    border: 1px solid var(--notes-line);
    border-radius: 8px;
    background: var(--notes-panel);
    overflow: hidden;
  }
  #panel-month { grid-area: month; }
  #panel-today { grid-area: today; }
  #panel-tomorrow { grid-area: tomorrow; }
  #panel-migrate { grid-area: migrate; }
  #panel-quick { grid-area: quick; }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 52px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--notes-line-soft);
  }
  .panel-title {
    margin: 0;
    font-size: var(--notes-size-18);
    font-weight: 700;
    line-height: 1.2;
    color: var(--notes-strong);
  }
  .panel-date { font-size: var(--notes-size-13); color: var(--notes-muted); text-align: right; }
  .panel-body { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 4px; }

  .empty {
    margin: 8px;
    padding: 12px;
    border: 1px solid var(--notes-line);
    border-radius: 8px;
    background: var(--notes-field);
    color: var(--notes-ink);
  }

  /* Three columns from 1000px, filling the window, as the sticky notes sit now:
     Month full height on the left, Today above Tomorrow in the middle, Migrate
     above Quick notes on the right. */
  @media (min-width: 1000px) {
    #app { height: calc(100dvh - var(--notes-header-height)); }
    .panels {
      height: 100%;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-areas: "month today migrate" "month tomorrow quick";
    }
  }

  /* Small window and iPad portrait: Month stays on the left, as tall as the
     window, and the other four stack on the right and the page scrolls. */
  @media (min-width: 761px) and (max-width: 999px) {
    .panels {
      align-items: start;
      grid-template-columns: minmax(260px, 0.8fr) minmax(0, 1.2fr);
      grid-template-areas: "month today" "month tomorrow" "month migrate" "month quick";
    }
    #panel-month {
      position: sticky;
      top: calc(var(--notes-header-height) + 12px);
      height: calc(100dvh - var(--notes-header-height) - 24px);
    }
    #panel-today, #panel-tomorrow, #panel-migrate, #panel-quick { min-height: 220px; }
    #panel-today .panel-body, #panel-tomorrow .panel-body, #panel-migrate .panel-body { flex: none; overflow: visible; }
  }

  /* Phone: one panel at a time, five tabs along the bottom. */
  @media (max-width: 760px) {
    #app { padding-bottom: calc(56px + env(safe-area-inset-bottom)); }
    .panels { display: block; padding: 8px; }
    .panel { display: none; height: calc(100dvh - var(--notes-header-height) - 56px - env(safe-area-inset-bottom) - 16px); }
    .panel[data-active="true"] { display: flex; }
    .tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      display: flex;
      gap: 4px;
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--notes-line);
      background: var(--notes-panel);
    }
    .tabbar button { flex: 1; min-height: 44px; padding: 0 4px; }
    .tabbar button[aria-selected="true"] {
      border: 1px solid var(--notes-line);
      background: var(--notes-selected);
      color: var(--notes-strong);
    }
    .flash { top: calc(var(--notes-header-height) + 4px); }
  }
  .tabbar { display: none; }
  @media (max-width: 760px) {
    .tabbar { display: flex; }
    .mark { display: none; }
    .bar-inner { padding: 0 8px; }
    .bar-right { gap: 2px; }
    #sign-out, #notes-link { padding: 0 8px; }
  }

  /* ---------- the add bar ---------- */

  .addbar { padding: 8px 12px 12px; border-top: 1px solid var(--notes-line-soft); background: var(--notes-panel); }
  .editor-line, .quick-editor {
    display: block;
    width: 100%;
    min-height: 36px;
    padding: 6px 12px;
    border: 1px solid var(--notes-line);
    border-radius: 8px;
    background: var(--notes-field);
    color: var(--notes-ink);
    overflow-wrap: anywhere;
  }
  .editor-line:empty::before, .quick-editor:empty::before {
    content: attr(data-placeholder);
    color: var(--notes-muted);
    pointer-events: none;
  }
  .addtools { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
  .addtools .grow { flex: 1; }
  .type-button, .fmt-button { width: 36px; padding: 0; border: 1px solid var(--notes-line); border-radius: 6px; }
  .type-button { color: var(--notes-icon); }
  .type-button[aria-pressed="true"] { background: var(--notes-selected); color: var(--notes-strong); }
  .fmt-button { color: var(--notes-ink); font-size: var(--notes-size-15); }
  .fmt-button[aria-pressed="true"] { background: var(--notes-selected); color: var(--notes-strong); }
  .fmt-button .struck { text-decoration: line-through; }
  @media (pointer: coarse) {
    .editor-line, .quick-editor { min-height: 44px; padding: 10px 12px; }
    .type-button, .fmt-button { width: 44px; }
  }

  /* ---------- entries ---------- */

  .entries { list-style: none; margin: 0; padding: 0 4px; }
  .entry { position: relative; border-radius: 8px; }
  .entry:hover { background: var(--notes-hover); }
  .entry-main { display: flex; align-items: flex-start; gap: 4px; min-height: 36px; padding-right: 4px; }
  .bullet {
    flex: none;
    width: 32px;
    height: 36px;
    min-height: 0;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: var(--notes-icon);
  }
  span.bullet { display: flex; align-items: center; justify-content: center; }
  button.bullet:hover { border-color: var(--notes-line); background: transparent; }
  .entry-text {
    flex: 1;
    min-width: 0;
    padding: 6px 4px;
    color: var(--notes-ink);
    overflow-wrap: anywhere;
    border-radius: 6px;
  }
  .entry-tail { display: flex; flex: none; align-items: center; gap: 4px; min-height: 36px; }
  .entry-note { font-size: var(--notes-size-12); color: var(--notes-muted); white-space: nowrap; }
  .entry[data-state="done"] .entry-text,
  .entry[data-state="dropped"] .entry-text { color: var(--notes-muted); text-decoration: line-through; }
  .entry[data-state="done"] .bullet,
  .entry[data-state="dropped"] .bullet,
  .entry[data-state="migrated"] .bullet,
  .entry[data-state="scheduled"] .bullet { color: var(--notes-muted); }
  .entry[data-state="migrated"] .entry-text,
  .entry[data-state="scheduled"] .entry-text { color: var(--notes-muted); }
  .entry.orphan { border: 1px solid var(--notes-line); }
  @media (pointer: coarse) {
    .entry-main { min-height: 44px; }
    .bullet { width: 44px; height: 44px; }
    .entry-text { padding: 10px 4px; }
    .entry-tail { min-height: 44px; }
    .date-row { min-height: 44px; }
    .line-text { min-height: 44px; padding: 10px 4px; }
  }

  /* The four moves. Under the text, opened by the More button, for a finger and
     for a narrow panel. In a wide panel with a mouse they sit at the right of
     the row while it is hovered or has focus, and take no room from the text. */
  .entry-actions { display: none; flex-wrap: wrap; gap: 4px; padding: 0 4px 8px 36px; }
  .entry-actions button { flex: 1 1 96px; min-height: 36px; }
  .entry[data-open="true"] .entry-actions { display: flex; }
  .entry[data-picking="true"] .entry-actions { display: none; }
  .more { color: var(--notes-icon); }
  .date-pick { display: none; margin: 0 4px 8px 36px; padding: 8px; border: 1px solid var(--notes-line); border-radius: 8px; background: var(--notes-field); }
  .entry[data-picking="true"] .date-pick { display: block; }
  .pick-head { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .pick-title { font-size: var(--notes-size-14); font-weight: 700; color: var(--notes-strong); }
  .pick-list { max-height: 264px; overflow-y: auto; margin-top: 4px; }
  .pick-day { display: flex; justify-content: space-between; width: 100%; border: 0; background: transparent; min-height: 36px; }
  .pick-day:hover { background: var(--notes-hover); }
  .pick-word { font-size: var(--notes-size-12); color: var(--notes-ink); }
  @media (pointer: coarse) {
    .entry-actions button { min-height: 44px; }
    .pick-day { min-height: 44px; }
  }
  @container panel (min-width: 440px) {
    @media (hover: hover) and (pointer: fine) {
      .entry-actions {
        position: absolute;
        top: 4px;
        right: 8px;
        padding: 0;
        background: var(--notes-hover);
        display: none;
      }
      .entry-actions button { flex: none; min-height: 28px; padding: 0 12px; border-radius: 6px; font-size: var(--notes-size-13); }
      .entry:hover .entry-actions, .entry:focus-within .entry-actions { display: flex; }
      .entry[data-open="true"] .entry-actions { display: flex; }
      .entry .more { display: none; }
      .entry:hover .entry-note, .entry:focus-within .entry-note { display: none; }
    }
  }

  /* ---------- the morning strip ---------- */

  .strip { margin: 8px; display: grid; gap: 8px; }
  .strip-group {
    padding: 8px 12px;
    border: 1px solid var(--notes-line);
    border-radius: 8px;
    background: var(--notes-field);
  }
  .strip-head { margin: 0 0 4px; font-size: var(--notes-size-14); font-weight: 700; color: var(--notes-strong); }
  .strip-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 2px 0; }
  .strip-row .strip-text { flex: 1 1 100px; min-width: 0; padding: 4px 0; overflow-wrap: anywhere; }
  .strip-buttons { display: flex; flex: 1 1 100%; gap: 4px; }
  .strip-buttons button { flex: 1; }
  .strip-foot { margin-top: 4px; }
  @container panel (min-width: 380px) {
    .strip-buttons { flex: none; }
    .strip-buttons button { flex: none; min-height: 32px; }
  }
  @media (pointer: coarse) {
    .strip-buttons button, .strip-foot { min-height: 44px; }
  }

  /* ---------- Month ---------- */

  .month-nav { display: flex; align-items: center; gap: 2px; min-width: 0; }
  .month-title { border: 0; background: transparent; font-size: var(--notes-size-18); font-weight: 700; color: var(--notes-strong); }
  .month-title:hover { background: var(--notes-hover); }
  .date-rows { list-style: none; margin: 0; padding: 0 4px; }
  .date-row { display: flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 4px; border-radius: 8px; }
  .date-row[data-mark="today"] { background: var(--notes-selected); }
  .date-row[data-mark="tomorrow"] { background: var(--notes-hover); }
  .date-open {
    flex: none;
    justify-content: flex-start;
    gap: 6px;
    width: 64px;
    padding: 0 6px;
    border: 0;
    background: transparent;
    font-variant-numeric: tabular-nums;
  }
  .date-open:hover { background: var(--notes-hover); }
  .date-row[data-mark="today"] .date-open:hover { background: transparent; }
  .date-open .num { font-weight: 700; color: var(--notes-strong); }
  .date-open .wk { font-size: var(--notes-size-12); font-weight: 600; color: var(--notes-muted); }
  .date-row[data-mark="today"] .date-open .wk { color: var(--notes-strong); }
  .date-row[data-mark="tomorrow"] .date-open .wk { color: var(--notes-ink); }
  .mark-word { flex: none; font-size: var(--notes-size-12); font-weight: 600; color: var(--notes-strong); }
  .line-text { flex: 1 1 auto; min-width: 3em; padding: 6px 4px; border-radius: 6px; color: var(--notes-ink); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .line-text:focus { white-space: normal; overflow: visible; }
  .line-events { flex: 0 1 auto; max-width: 55%; font-size: var(--notes-size-13); color: var(--notes-ink); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .chip {
    display: inline-flex;
    align-items: center;
    flex: none;
    height: 22px;
    padding: 0 8px;
    border: 1px solid var(--notes-line);
    border-radius: 6px;
    background: var(--notes-panel);
    color: var(--notes-ink);
    font-size: var(--notes-size-12);
    font-weight: 600;
    line-height: 1;
  }
  .month-picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px; }
  .month-picker button { border: 1px solid var(--notes-line); }
  .month-picker button[aria-current="true"] { background: var(--notes-selected); color: var(--notes-strong); }
  .year-bar { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 0; }
  .year-bar span { font-weight: 700; color: var(--notes-strong); }
  .day-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; }

  /* ---------- Quick notes ---------- */

  .quick-tools { display: flex; align-items: center; gap: 4px; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: var(--notes-size-12); color: var(--notes-muted); }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 6px; background: var(--notes-muted); }
  .status[data-state="saved"]::before { background: var(--notes-good); }
  .status[data-state="unsaved"]::before { background: var(--notes-warn); }
  .status[data-state="failed"]::before { background: var(--notes-bad); }
  .moved { flex: none; border-top: 1px solid var(--notes-line-soft); padding: 0 8px; }
  .moved-toggle { min-height: 32px; padding: 0 8px; border: 0; background: transparent; color: var(--notes-muted); font-size: var(--notes-size-13); font-weight: 600; }
  .moved-toggle:hover { background: var(--notes-hover); }
  .moved-list { max-height: 9rem; overflow-y: auto; padding: 0 0 8px; }
  @media (pointer: coarse) { .moved-toggle { min-height: 44px; } }
  .quick-body { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; }
  .quick-editor { min-height: 100%; border: 0; background: var(--notes-field); white-space: pre-wrap; }
  @media (min-width: 761px) and (max-width: 999px) { .quick-editor { min-height: 160px; } }
</style>
