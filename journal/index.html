        event.preventDefault();
        add();
      }
    });

    function add() {
      var text = readEditor(editor);
      if (core.cleanText(text) === "") { return; }
      var list = listKey();
      if (!list) { return; }
      var type = state.type;
      var id = newId();
      editor.textContent = "";
      state.prefixBackup = null;
      submit({ op: "add", list: list, entry: { id: id, type: type, text: text } }, {
        onFail: function () {
          // Give back what was typed, if the line is still empty.
          if (readEditor(editor) === "") { drawMarks(editor, text, false); }
        }
      });
    }

    addBars[key] = { editor: editor, setType: setType };
    return addBars[key];
  }

  /* ---------- entries ---------- */

  function destinationWords(entry, listKey) {
    var to = core.parseList(entry.to);
    if (!to) { return ""; }
    if (to.kind === "day") {
      if (to.date === today) { return "to Today"; }
      if (to.date === tomorrow()) { return "to Tomorrow"; }
      return "to " + shortDate(to.date);
    }
    var from = core.parseList(listKey);
    return to.month === from.month ? "to Migrate" : "to " + monthName(to.month);
  }

  var STATE_WORDS = { open: "", done: "Done", migrated: "Moved forward", scheduled: "Scheduled", dropped: "Dropped" };

  function bulletIcon(entry) {
    if (entry.state === "done") { return "j-done"; }
    if (entry.state === "migrated") { return "j-migrated"; }
    if (entry.state === "scheduled") { return "j-scheduled"; }
    return TYPE_ICON[entry.type];
  }

  function rowText(entry) { return core.plainText(entry.text); }

  // One entry as a row. The state is told twice, by the shape of the bullet and
  // by words, and the greyed states never change the colour by opacity.
  function entryRow(listKey, entry) {
    var li = make("li", "entry");
    li.setAttribute("data-id", entry.id);
    li.setAttribute("data-state", entry.state);
    li.setAttribute("data-type", entry.type);
    li.setAttribute("data-rev", String(entry.rev));
    var editable = entry.state === "open" || entry.state === "done";
    var open = ui.openMove && ui.openMove.list === listKey && ui.openMove.id === entry.id;
    var picking = ui.picking && ui.picking.list === listKey && ui.picking.id === entry.id;
    if (open) { li.setAttribute("data-open", "true"); }
    if (picking) { li.setAttribute("data-picking", "true"); }

    var main = make("div", "entry-main");
    var bullet;
    if (entry.type === "task" && editable) {
      bullet = make("button", "bullet");
      bullet.type = "button";
      bullet.setAttribute("aria-label", (entry.state === "done" ? "Mark not done: " : "Mark done: ") + rowText(entry));
      bullet.setAttribute("aria-pressed", entry.state === "done" ? "true" : "false");
      bullet.addEventListener("click", function () {
        var current = findEntry(listKey, entry.id);
        if (!current) { return; }
        submit({ op: "state", list: listKey, id: entry.id, rev: current.rev, state: current.state === "done" ? "open" : "done" }, {});
      });
    } else {
      bullet = make("span", "bullet");
      bullet.setAttribute("role", "img");
      bullet.setAttribute("aria-label", TYPE_NAME[entry.type] + (STATE_WORDS[entry.state] ? ", " + STATE_WORDS[entry.state].toLowerCase() : ""));
    }
    bullet.appendChild(icon(bulletIcon(entry)));
    main.appendChild(bullet);

    var text = make("div", "entry-text");
    drawMarks(text, entry.text, false);
    if (editable) {
      text.setAttribute("contenteditable", "true");
      text.setAttribute("role", "textbox");
      text.setAttribute("aria-label", "Entry text");
      text.setAttribute("data-editor", "single");
      text.setAttribute("spellcheck", "true");
      text.setAttribute("lang", "en-GB");
      wireEditor(text);
      wireEntryEditing(text, listKey, entry);
    }
    main.appendChild(text);

    var tail = make("div", "entry-tail");
    if (entry.state === "migrated" || entry.state === "scheduled") {
      tail.appendChild(make("span", "entry-note", destinationWords(entry, listKey)));
    } else if (entry.state === "dropped") {
      tail.appendChild(make("span", "entry-note", "Dropped"));
    }
    if (editable) {
      var bin = make("button", "icon-button entry-delete");
      bin.type = "button";
      bin.setAttribute("aria-label", "Delete entry: " + rowText(entry));
      bin.title = "Delete entry";
      bin.appendChild(icon("i-bin"));
      bin.addEventListener("click", function () {
        var current = findEntry(listKey, entry.id);
        if (current) { deleteEntry(listKey, current, {}); }
      });
      tail.appendChild(bin);
    }
    if (entry.state === "open") {
      var more = make("button", "icon-button more");
      more.type = "button";
      more.setAttribute("aria-label", "Move this entry: " + rowText(entry));
      more.setAttribute("aria-expanded", open ? "true" : "false");
      more.title = "Move this entry";
      more.appendChild(icon("j-more"));
      more.addEventListener("click", function () {
        var same = ui.openMove && ui.openMove.list === listKey && ui.openMove.id === entry.id;
        ui.openMove = same ? null : { list: listKey, id: entry.id };
        ui.picking = null;
        renderAll();
        if (!same) { focusWithin(listKey, entry.id, ".entry-actions button"); } else { focusWithin(listKey, entry.id, ".more"); }
      });
      tail.appendChild(more);
    }
    main.appendChild(tail);
    li.appendChild(main);

    if (entry.state === "open") {
      wireDrag(li, listKey, entry);
      li.appendChild(moveButtons(listKey, entry));
      li.appendChild(datePicker(listKey, entry));
    }
    return li;
  }

  function focusWithin(listKey, id, selector) {
    var row = document.querySelector('li.entry[data-id="' + id + '"]');
    var target = row && row.querySelector(selector);
    if (target) { target.focus(); }
  }

  function findEntry(listKey, id) {
    return core.entriesOf(shown, listKey).filter(function (e) { return e.id === id; })[0] || null;
  }

  // Click the text to edit it where it is. Enter saves, Escape puts the old text
  // back, and clearing the text deletes the entry, with an Undo.
  function wireEntryEditing(editor, listKey, entry) {
    var original = null;
    var cancelled = false;
    editor.addEventListener("focus", function () { original = readEditor(editor); cancelled = false; });
    editor.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); editor.blur(); }
      else if (event.key === "Escape") { event.preventDefault(); cancelled = true; drawMarks(editor, original === null ? entry.text : original, false); editor.blur(); }
    });
    editor.addEventListener("blur", function () {
      if (original === null) { return; }
      var typed = readEditor(editor);
      var before = original;
      original = null;
      if (cancelled || typed === before) { return; }
      if (core.cleanText(typed) === "") {
        deleteEntry(listKey, entry, { onFail: function () { restoreEditing(listKey, entry.id, typed); } });
        return;
      }
      submit({ op: "edit", list: listKey, id: entry.id, rev: entry.rev, text: typed }, {
        onFail: function () { restoreEditing(listKey, entry.id, typed); }
      });
    });
  }

  // Deletes an entry: a new revision marked removed, at once, with no question. The
  // message offers Undo for ten seconds, which makes the entry again as a new one,
  // because a removed entry keeps its id.
  function deleteEntry(listKey, entry, hooks) {
    var kept = { type: entry.type, state: entry.state, text: entry.text };
    return submit({ op: "remove", list: listKey, id: entry.id, rev: entry.rev }, hooks).then(function (ok) {
      if (ok) { offerUndo("Entry deleted.", [{ op: "add", list: listKey, entry: { id: newId(), type: kept.type, text: kept.text, state: kept.state } }]); }
      return ok;
    });
  }

  // After a refused edit the row shows the typed text again, still editable.
  function restoreEditing(listKey, id, typed) {
    var row = document.querySelector('li.entry[data-id="' + id + '"]');
    var editor = row && row.querySelector(".entry-text[contenteditable]");
    if (!editor) { return; }
    drawMarks(editor, typed, false);
    editor.focus();
  }

  function moveButtons(listKey, entry) {
    var group = make("div", "entry-actions");
    group.setAttribute("role", "group");
    group.setAttribute("aria-label", "Move this entry");
    var targets = [
      { word: "Today", list: core.dayList(today), how: "migrated" },
      { word: "Tomorrow", list: core.dayList(tomorrow()), how: "migrated" },
      { word: "Migrate", list: core.migrateList(thisMonth()), how: "migrated" }
    ];
    targets.forEach(function (target) {
      if (target.list === listKey) { return; }
      var b = make("button", "", target.word);
      b.type = "button";
      b.setAttribute("aria-label", target.word + ": " + rowText(entry));
      b.addEventListener("click", function () { moveEntry(listKey, entry.id, target.list, target.how); });
      group.appendChild(b);
    });
    var date = make("button", "", "Date");
    date.type = "button";
    date.setAttribute("aria-label", "Pick a date: " + rowText(entry));
    date.addEventListener("click", function () {
      ui.openMove = { list: listKey, id: entry.id };
      ui.picking = { list: listKey, id: entry.id, month: viewMonth < thisMonth() ? thisMonth() : viewMonth };
      renderAll();
      focusWithin(listKey, entry.id, ".pick-day");
    });
    group.appendChild(date);
    return group;
  }

  /* ---------- dragging an entry, with a mouse ---------- */

  var mouse = window.matchMedia("(hover: hover) and (pointer: fine)");
  var dragging = null;     // { list, id } while one of this page's entries is being dragged
  var dropMark = null;     // the element that has the selected fill

  // An entry is picked up anywhere but in its text while the text is being edited,
  // so a drag there still selects words.
  function wireDrag(li, listKey, entry) {
    if (!mouse.matches) { return; }
    li.setAttribute("draggable", "true");
    li.addEventListener("mousedown", function (event) {
      var text = li.querySelector(".entry-text");
      var editing = text && text.contains(document.activeElement) && text.contains(event.target);
      li.setAttribute("draggable", editing ? "false" : "true");
    }, true);
    li.addEventListener("dragstart", function (event) {
      dragging = { list: listKey, id: entry.id };
      // Only a marker of this page's own drag: no text of the entry leaves the page.
      event.dataTransfer.setData("application/x-journal-entry", entry.id);
      event.dataTransfer.effectAllowed = "move";
      li.setAttribute("data-dragging", "true");
    });
    li.addEventListener("dragend", function () {
      dragging = null;
      li.removeAttribute("data-dragging");
      markDrop(null);
    });
  }

  // Where a drop would go: Today, Tomorrow or Migrate (the same move as their
  // buttons), or a date from today on in Month (the same move as the Date picker).
  // Nothing for the list the entry is already in.
  function dropTarget(node) {
    if (!dragging || !node || !node.closest) { return null; }
    var row = node.closest("li.date-row");
    var found = null;
    if (row) {
      var date = row.getAttribute("data-date");
      if (date && date >= today) { found = { el: row, list: core.dayList(date), how: "scheduled" }; }
    } else {
      var panel = node.closest(".panel");
      var name = panel && panel.getAttribute("data-panel");
      if (name === "today") { found = { el: panel, list: core.dayList(today), how: "migrated" }; }
      else if (name === "tomorrow") { found = { el: panel, list: core.dayList(tomorrow()), how: "migrated" }; }
      else if (name === "migrate") { found = { el: panel, list: core.migrateList(thisMonth()), how: "migrated" }; }
    }
    return found && found.list !== dragging.list ? found : null;
  }

  function markDrop(el) {
    if (dropMark === el) { return; }
    if (dropMark) { dropMark.removeAttribute("data-drop"); }
    dropMark = el;
    if (dropMark) { dropMark.setAttribute("data-drop", "true"); }
  }

  document.addEventListener("dragover", function (event) {
    var target = dropTarget(event.target);
    markDrop(target ? target.el : null);
    if (target) { event.preventDefault(); event.dataTransfer.dropEffect = "move"; }
  });
  document.addEventListener("dragleave", function (event) {
    if (event.relatedTarget === null) { markDrop(null); }
  });
  document.addEventListener("drop", function (event) {
    var target = dropTarget(event.target);
    var item = dragging;
    markDrop(null);
    if (!target || !item) { return; }
    event.preventDefault();
    dragging = null;
    moveEntry(item.list, item.id, target.list, target.how);
  });

  // Whether the page was last worked by keyboard, so the moves show on focus only then.
  document.documentElement.setAttribute("data-input", "mouse");
  document.addEventListener("keydown", function (event) {
    if (event.key === "Tab") { document.documentElement.setAttribute("data-input", "keyboard"); }
  }, true);
  document.addEventListener("pointerdown", function (event) {
    // Pressing one of the move buttons that keyboard focus showed does not hide them.
    if (event.target.closest && event.target.closest(".entry-actions")) { return; }
    document.documentElement.setAttribute("data-input", "mouse");
  }, true);

  function moveEntry(listKey, id, target, how) {
    var entry = findEntry(listKey, id);
    if (!entry) { return; }
    var op = { op: "move", from: listKey, to: target, how: how, items: [{ id: id, rev: entry.rev }] };
    ui.openMove = null;
    ui.picking = null;
    submit(op, {}).then(function (ok) {
      if (!ok) { return; }
      var to = core.parseList(target);
      var words = to.kind === "day" ? (to.date === today ? "Today" : to.date === tomorrow() ? "Tomorrow" : longDate(to.date)) : "Migrate";
      // A move to a day says which day, and the message offers to open it, so a
      // moved entry is never somewhere the person cannot see.
      var open = to.kind === "day" ? { label: "Open day", run: function () { openDay(to.date); return true; } } : null;
      offerUndo("Moved to " + words + ".", [undoOp(listKey, id, target)], open);
    });
  }

  // The dates of a month as rows, from today on, inside the row that is being
  // moved. Rows rather than a grid, so each is 44px tall and the full width.
  function datePicker(listKey, entry) {
    var picker = make("div", "date-pick");
    var picking = ui.picking && ui.picking.list === listKey && ui.picking.id === entry.id ? ui.picking : null;
    if (!picking) { return picker; }
    var head = make("div", "pick-head");
    var prev = make("button", "icon-button");
    prev.type = "button";
    prev.setAttribute("aria-label", "Previous month");
    prev.disabled = picking.month <= thisMonth();
    prev.appendChild(icon("i-chevron-left"));
    prev.addEventListener("click", function () { picking.month = core.addMonths(picking.month, -1); renderAll(); focusWithin(listKey, entry.id, ".pick-head .icon-button:last-child"); });
    var title = make("span", "pick-title", monthYear(picking.month));
    var next = make("button", "icon-button");
    next.type = "button";
    next.setAttribute("aria-label", "Next month");
    next.appendChild(icon("j-chevron-right"));
    next.addEventListener("click", function () { picking.month = core.addMonths(picking.month, 1); renderAll(); focusWithin(listKey, entry.id, ".pick-head .icon-button:last-child"); });
    head.appendChild(prev); head.appendChild(title); head.appendChild(next);
    picker.appendChild(head);
    var list = make("div", "pick-list");
    var total = core.daysInMonth(picking.month);
    for (var d = 1; d <= total; d += 1) {
      var date = picking.month + "-" + (d < 10 ? "0" : "") + d;
      if (date < today) { continue; }
      list.appendChild(pickDay(listKey, entry, date));
    }
    picker.appendChild(list);
    var done = make("button", "quiet", "Cancel");
    done.type = "button";
    done.addEventListener("click", function () { ui.picking = null; ui.openMove = null; renderAll(); focusWithin(listKey, entry.id, ".more"); });
    picker.appendChild(done);
    return picker;
  }

  function pickDay(listKey, entry, date) {
    var b = make("button", "pick-day");
    b.type = "button";
    b.appendChild(make("span", "", fmtWeekday.format(utc(date)) + " " + shortDate(date)));
    var word = date === today ? "Today" : date === tomorrow() ? "Tomorrow" : "";
    if (word) { b.appendChild(make("span", "pick-word", word)); }
    b.setAttribute("aria-label", "Schedule for " + longDate(date) + ": " + rowText(entry));
    if (date === listKey.slice(4)) { b.disabled = true; }
    b.addEventListener("click", function () { moveEntry(listKey, entry.id, core.dayList(date), "scheduled"); });
    return b;
  }

  /* ---------- lists ---------- */

  var EMPTY = {
    today: function () { return "Nothing logged for " + longDate(today) + " yet. Type a task, an event or a note below."; },
    tomorrow: function () { return "Nothing planned for " + longDate(tomorrow()) + " yet. Add a task or event below, or move one here from another list."; },
    migrate: function () { return "No tasks waiting this month. Add one below, or choose Migrate on any entry to park it here."; },
    day: function (date) { return "Nothing logged for " + longDate(date) + ". Type a task, an event or a note below."; }
  };

  // Draws a list. A row being edited stays exactly as it is, so a change that
  // arrives from another device never takes the typing away.
  // A row that has not changed is the same element as before, so a redraw after
  // a save does not rebuild the whole list under the person's hand.
  function rowSignature(listKey, entry) {
    var open = ui.openMove && ui.openMove.list === listKey && ui.openMove.id === entry.id;
    var picking = ui.picking && ui.picking.list === listKey && ui.picking.id === entry.id ? ui.picking.month : "";
    return [entry.id, entry.type, entry.state, entry.rev, entry.text, entry.to || "", open ? "o" : "", picking, today].join("|");
  }

  // A moved or scheduled entry is kept in storage with its arrow and where it went,
  // and is not shown in the list. A quiet line at the bottom of the panel says how
  // many there are and opens and closes them. Closed until asked (22 October 2026).
  function isMoved(entry) { return entry.state === "migrated" || entry.state === "scheduled"; }

  function renderMoved(name, listKey, moved) {
    var host = $("moved-" + name);
    if (!host) { return; }
    host.hidden = moved.length === 0;
    var list = $("moved-list-" + name);
    var open = moved.length > 0 && ui.movedOpen[listKey] === true;
    var toggle = $("moved-toggle-" + name);
    toggle.textContent = moved.length + " moved";
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
    list.hidden = !open;
    list.textContent = "";
    if (open) { moved.forEach(function (entry) { list.appendChild(entryRow(listKey, entry)); }); }
  }

  function movedListKey(name) {
    if (name === "today") { return core.dayList(today); }
    if (name === "tomorrow") { return core.dayList(tomorrow()); }
    if (name === "migrate") { return core.migrateList(thisMonth()); }
    return dayView ? core.dayList(dayView) : null;
  }

  ["today", "tomorrow", "migrate", "day"].forEach(function (name) {
    $("moved-toggle-" + name).addEventListener("click", function () {
      var key = movedListKey(name);
      if (!key) { return; }
      ui.movedOpen[key] = !ui.movedOpen[key];
      renderAll();
    });
  });

  function renderList(listEl, emptyEl, listKey, emptyText, movedName) {
    var all = core.entriesOf(shown, listKey);
    var entries = all.filter(function (e) { return !isMoved(e); });
    renderMoved(movedName, listKey, all.filter(isMoved));
    var active = document.activeElement;
    var keep = null;
    if (active && listEl.contains(active) && active.matches && active.matches(".entry-text[contenteditable]")) {
      keep = active.closest("li.entry");
    }
    var before = {};
    Array.prototype.forEach.call(listEl.children, function (row) { before[row.getAttribute("data-id")] = row; });
    var rows = [];
    var seen = false;
    entries.forEach(function (entry) {
      if (keep && keep.getAttribute("data-id") === entry.id) { rows.push(keep); seen = true; return; }
      var signature = rowSignature(listKey, entry);
      var held = before[entry.id];
      if (held && held._signature === signature && !held.classList.contains("orphan")) { rows.push(held); return; }
      var row = entryRow(listKey, entry);
      row._signature = signature;
      rows.push(row);
    });
    if (keep && !seen) { keep.classList.add("orphan"); rows.push(keep); }
    listEl.textContent = "";
    rows.forEach(function (row) { listEl.appendChild(row); });
    emptyEl.hidden = entries.length > 0;
    if (entries.length === 0) { emptyEl.textContent = emptyText; }
  }

  // Each panel draws itself and knows nothing of the others. Today carries the
  // morning strip, Month carries the log of a date opened in it.
  function renderToday() {
    $("date-today").textContent = longDate(today);
    renderList($("list-today"), $("empty-today"), core.dayList(today), EMPTY.today(), "today");
    renderStrip();
  }

  function renderTomorrow() {
    $("date-tomorrow").textContent = longDate(tomorrow());
    renderList($("list-tomorrow"), $("empty-tomorrow"), core.dayList(tomorrow()), EMPTY.tomorrow(), "tomorrow");
  }

  function renderMigrate() {
    $("date-migrate").textContent = monthYear(thisMonth());
    renderList($("list-migrate"), $("empty-migrate"), core.migrateList(thisMonth()), EMPTY.migrate(), "migrate");
  }

  /* ---------- the morning strip ---------- */

  function groupHeading(group, kind) {
    var n = group.tasks.length;
    var count = n + " open " + (n === 1 ? "task" : "tasks");
    if (kind === "monthly") { return "From " + monthName(group.month) + ", " + count + " on Migrate"; }
    return (group.date === core.addDays(today, -1) ? "From yesterday" : "From " + longDate(group.date)) + ", " + count;
  }

  function stripGroup(group, kind) {
    var box = make("section", "strip-group");
    box.setAttribute("aria-label", kind === "monthly" ? "Open tasks from last month" : "Open tasks from an earlier day");
    box.setAttribute("data-kind", kind);
    box.appendChild(make("p", "strip-head", groupHeading(group, kind)));
    var destination = kind === "monthly" ? core.migrateList(thisMonth()) : core.dayList(today);
    group.tasks.forEach(function (task) {
      var row = make("div", "strip-row");
      var bullet = make("span", "bullet");
      bullet.setAttribute("role", "img");
      bullet.setAttribute("aria-label", "Task");
      bullet.appendChild(icon("j-task"));
      row.appendChild(bullet);
      var text = make("div", "strip-text");
      drawMarks(text, task.text, false);
      row.appendChild(text);
      var buttons = make("div", "strip-buttons");
      var bring = make("button", "primary", "Bring forward");
      bring.type = "button";
      bring.setAttribute("aria-label", "Bring forward: " + rowText(task));
      bring.addEventListener("click", function () { bringForward(group, [task], destination); });
      var drop = make("button", "", "Drop");
      drop.type = "button";
      drop.setAttribute("aria-label", "Drop: " + rowText(task));
      drop.addEventListener("click", function () { dropTasks(group, [task]); });
      buttons.appendChild(bring);
      buttons.appendChild(drop);
      row.appendChild(buttons);
      box.appendChild(row);
    });
    if (group.tasks.length > 1) {
      var all = make("button", "strip-foot", "Bring all forward");
      all.type = "button";
      all.addEventListener("click", function () { bringForward(group, group.tasks, destination); });
      box.appendChild(all);
    }
    return box;
  }

  function stripRemaining() {
    var g = core.stripFrom(stripFiles(), today);
    return (g.daily ? g.daily.tasks.length : 0) + (g.monthly ? g.monthly.tasks.length : 0);
  }

  // Undoing a change names the revision the entry has now, as the page shows it,
  // which is the one the shared rules gave it. The page never works it out.
  function undoOp(listKey, id, toList) {
    var now = findEntry(listKey, id);
    var op = { op: "undo", list: listKey, id: id, rev: now ? now.rev : 1 };
    if (toList) { op.toList = toList; }
    return op;
  }

  function bringForward(group, tasks, destination) {
    var items = tasks.map(function (t) { return { id: t.id, rev: t.rev }; });
    submit({ op: "move", from: group.list, to: destination, how: "migrated", items: items }, {}).then(function (ok) {
      if (!ok) { return; }
      var undo = tasks.map(function (t) { return undoOp(group.list, t.id, destination); });
      offerUndo(stripRemaining() === 0 ? "All handled." : "Brought forward.", undo);
    });
  }

  function dropTasks(group, tasks) {
    var items = tasks.map(function (t) { return { id: t.id, rev: t.rev }; });
    submit({ op: "drop", list: group.list, items: items }, {}).then(function (ok) {
      if (!ok) { return; }
      var undo = tasks.map(function (t) { return undoOp(group.list, t.id, null); });
      offerUndo(stripRemaining() === 0 ? "All handled." : "Dropped.", undo);
    });
  }

  function renderStrip() {
    var host = $("strip");
    var groups = core.stripFrom(stripFiles(), today);
    host.textContent = "";
    if (groups.daily) { host.appendChild(stripGroup(groups.daily, "daily")); }
    if (groups.monthly) { host.appendChild(stripGroup(groups.monthly, "monthly")); }
    host.hidden = !(groups.daily || groups.monthly);
  }

  /* ---------- Month ---------- */

  function dayEvents(day) {
    return day.entries.filter(function (e) { return e.type === "event" && (e.state === "open" || e.state === "done"); });
  }

  /* ---------- Month rows, and spans ---------- */

  var fmtWeekdayLong = new Intl.DateTimeFormat("en-GB", { weekday: "long", day: "numeric", timeZone: "UTC" });
  var monthLayout = { rows: {}, overflow: [] };   // how the viewed month shows its spans
  var untilMenu = null;                           // { date, view, month } while the Until menu is open
  var EMPTY_ROW = { texts: [], bars: [], lanes: 0 };

  function weekdayDay(date) { return fmtWeekday.format(utc(date)) + " " + (+date.slice(8)); }

  // Where a span ends, as it is written after the words: "Thu 12", with the month
  // when that is another month.
  function endWords(span, month) {
    var words = weekdayDay(span.end);
    return core.monthOf(span.end) === month ? words : words + " " + fmtMonthShort.format(utc(span.end));
  }

  // For a screen reader: "Possible Germany, Monday 9 to Thursday 12 November".
  function spanLabel(span) {
    var sameMonth = core.monthOf(span.start) === core.monthOf(span.end);
    var from = sameMonth ? fmtWeekdayLong.format(utc(span.start)) : longDate(span.start);
    return core.plainText(span.text) + ", " + from + " to " + longDate(span.end);
  }

  function spanRangeText(lead, month) {
    return (lead.continued ? "continued, to " : "to ") + endWords(lead.span, month);
  }

  function rowSignatureOf(rowSpan) {
    return JSON.stringify([
      rowSpan.texts.map(function (t) { return [t.span.id, t.span.rev, t.span.start, t.span.end, t.span.text, t.continued]; }),
      rowSpan.bars.map(function (b) { return [b.id, b.lane, b.foot, b.top, b.day, b.total]; }),
      rowSpan.lanes
    ]);
  }

  function dateRow(date, rowSpan) {
    rowSpan = rowSpan || EMPTY_ROW;
    var file = shown[core.monthOf(date)];
    var day = file && file.days[date] ? file.days[date] : { line: "", lineRev: 0, entries: [] };
    var lead = rowSpan.texts.length > 0 ? rowSpan.texts[0] : null;
    var li = make("li", "date-row");
    li.setAttribute("data-date", date);
    if (date < today) { li.setAttribute("data-past", "true"); }
    var mark = date === today ? "today" : date === tomorrow() ? "tomorrow" : "";
    if (mark) { li.setAttribute("data-mark", mark); }
    if (lead) { li.setAttribute("data-lead", "true"); li.setAttribute("data-lead-span", lead.span.id); }
    li.style.setProperty("--lanes", String(rowSpan.lanes));

    var open = make("button", "date-open");
    open.type = "button";
    open.setAttribute("aria-label", "Open the log for " + longDate(date));
    open.appendChild(make("span", "num", String(+date.slice(8))));
    open.appendChild(make("span", "wk", fmtWeekday.format(utc(date))));
    open.addEventListener("click", function () { openDay(date); });
    li.appendChild(open);
    var gutter = make("span", "span-gutter");
    gutter.setAttribute("aria-hidden", "true");
    li.appendChild(gutter);
    if (mark) { li.appendChild(make("span", "mark-word", mark === "today" ? "Today" : "Tomorrow")); }

    var line = make("div", "line-text");
    line.setAttribute("contenteditable", "true");
    line.setAttribute("role", "textbox");
    line.setAttribute("data-editor", "single");
    line.setAttribute("data-placeholder", "Add to " + shortDate(date));
    line.setAttribute("spellcheck", "true");
    line.setAttribute("lang", "en-GB");

    // that is not the span's own words, the other spans on the row, and the events.
    var extras = [];

    rowSpan.texts.slice(1).forEach(function (t) { extras.push(core.plainText(t.span.text) + " (" + spanRangeText(t, core.monthOf(date)) + ")"); });
    dayEvents(day).forEach(function (e) { extras.push(core.plainText(e.text)); });
    if (extras.length > 0) {
      var tail = make("span", "line-events", extras.join("; "));
      tail.title = tail.textContent;

    var visible = core.liveEntries(day.entries).filter(function (e) { return !isMoved(e); }).length;

    var foot = rowSpan.bars.filter(function (b) { return b.foot; })[0] || null;
    var hasText = Boolean(lead) || day.line !== "";

    if (foot || (!lead && day.line !== "")) { li.appendChild(spanHandle(date, foot ? foot.id : null)); }

    if (untilMenu && untilMenu.date === date) { li.setAttribute("data-until-open", "true"); }

  }

  function dateSignature(date, rowSpan) {
    var file = shown[core.monthOf(date)];
    var day = file && file.days[date] ? file.days[date] : null;
    var events = day ? dayEvents(day).map(function (e) { return e.id + e.rev; }).join(",") : "";

  /* ---------- editing the words of a span ---------- */

  function wireSpanLine(editor, id) {
    var original = null;
    var cancelled = false;
    editor.addEventListener("focus", function () { original = readEditor(editor); cancelled = false; });
    editor.addEventListener("input", function () {
      if (selectedSpan !== null) { selectedSpan = null; markSelected(); }
    });
    editor.addEventListener("keydown", function (event) {
      if (event.key === "Enter") { event.preventDefault(); editor.blur(); }
      else if (event.key === "Escape") {
        event.preventDefault();
        cancelled = true;
        var held = spansShown[id];
        drawMarks(editor, original === null ? (held ? held.text : "") : original, false);
        selectedSpan = null;
        markSelected();
        editor.blur();
      } else if (event.key === "Delete" && selectedSpan === id && String(window.getSelection()) === editor.textContent) {
        // The whole span is selected (its bar was clicked): Delete takes it all away.
        event.preventDefault();
        cancelled = true;
        editor.blur();
        removeSpan(id);
      }
    });
    editor.addEventListener("blur", function () {
      if (original === null) { return; }
      var typed = readEditor(editor);
      var before = original;
      original = null;
      if (cancelled || typed === before) { return; }
      var span = spansShown[id];
      if (!span || span.state !== "open") { return; }
      // Clearing the words takes the whole span away, with an Undo.
      if (typed === "") { removeSpan(id); return; }
      submit({ op: "spanEdit", id: id, rev: span.rev, text: typed }, {
        onFail: function () {
          var row = document.querySelector('.line-text[data-span-id="' + id + '"]');
          if (row) { drawMarks(row, typed, false); row.focus(); }
        }
      });
    });
  }

  function removeSpan(id) {
    var span = spansShown[id];
    if (!span || span.state !== "open") { return; }
    var kept = { start: span.start, end: span.end, text: span.text };
    selectedSpan = null;
    submit({ op: "spanRemove", id: id, rev: span.rev }, {}).then(function (ok) {
      if (!ok) { return; }
      // Undo makes the span again as a new one: a removed span keeps its id.
      offerUndo("Span deleted.", [{ op: "spanAdd", span: { id: newId(), start: kept.start, end: kept.end, text: kept.text } }]);
    });
  }

  function markSelected() {
    Array.prototype.forEach.call(document.querySelectorAll(".span-bar"), function (bar) {
      if (selectedSpan !== null && bar.getAttribute("data-span-id") === selectedSpan) { bar.setAttribute("data-selected", "true"); }
      else { bar.removeAttribute("data-selected"); }
    });
    Array.prototype.forEach.call(document.querySelectorAll(".date-row[data-lead-span]"), function (row) {
      if (selectedSpan !== null && row.getAttribute("data-lead-span") === selectedSpan) { row.setAttribute("data-selected-span", "true"); }
      else { row.removeAttribute("data-selected-span"); }
    });
  }

  // Clicking a bar selects the whole span and puts the cursor in its words, which
  // are on the first day (or on the 1st when it has run in from an earlier month).
  function selectSpan(id) {
    var span = spansShown[id];
    if (!span || span.state !== "open") { return; }
    var focusWords = function () {
      var editor = document.querySelector('.line-text[data-span-id="' + id + '"]');
      if (!editor) { return false; }
      selectedSpan = id;
      editor.focus();
      var range = document.createRange();
      range.selectNodeContents(editor);
      var selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      markSelected();
      return true;
    };
    if (focusWords()) { return; }

    // go to the month it starts in.
    var month = core.monthOf(span.start);
    loadMonths([month]).then(function (ok) {
      if (!ok) { return; }
      viewMonth = month;
      renderAll();
      focusWords();
    });
  }

  /* ---------- making, resizing and ending a span ---------- */

  // A line becomes a span: the span is made first, then the line is cleared, so
  // a failure between the two leaves the words twice and never loses them.
  function makeSpan(date, end) {
    var line = core.lineOf(shown, date);
    if (line.text === "") { return; }
    var id = core.spanIdFor(date, line.rev);
    submit({ op: "spanAdd", span: { id: id, start: date, end: end, text: line.text } }, {}).then(function (ok) {
      if (!ok) { return; }
      submit({ op: "line", date: date, rev: line.rev, text: "" }, {});
    });
  }

  function resizeSpan(id, end) {
    var span = spansShown[id];
    if (!span || span.state !== "open" || end === span.end) { return; }
    if (end <= span.start) { justThisDay(id); return; }
    if (core.daysBetween(span.start, end) + 1 > core.MAX_SPAN_DAYS) {
      showFlash("A span can cover 366 days at most.", null, true);
      return;
    }
    submit({ op: "spanEdit", id: id, rev: span.rev, end: end }, {});
  }

  // The span goes and its words stay as the line: the line is written first, then
  // the span is removed, so a failure between the two leaves the words twice.
  function justThisDay(id) {
    var span = spansShown[id];
    if (!span || span.state !== "open") { return; }
    var line = core.lineOf(shown, span.start);
    var text = span.text;
    if (line.text !== "" && line.text !== span.text) {
      text = line.text + "; " + span.text;
      if (core.cleanText(text).length > core.MAX_LINE) {
        showFlash("That day already has a line, and both together are too long. Shorten the line first.", null, true);
        return;

    }
    selectedSpan = null;
    var ask = function () { return submit({ op: "spanRemove", id: id, rev: span.rev }, {}); };
    if (text === line.text) { ask(); return; }
    submit({ op: "line", date: span.start, rev: line.rev, text: text }, {}).then(function (ok) { if (ok) { ask(); } });
  }

  /* ---------- the handle: dragging a span out or in with a mouse ---------- */

  }

  function monthRows() { return Array.prototype.slice.call($("date-rows").children); }

  // The row the pointer is on, or the first or last when it is above or below the list.
  function rowAt(y) {

    for (var i = 0; i < rows.length; i += 1) {

  }

  function updateSpanDrag(x, y) {

    else if (y < frame.top + 28) { body.scrollTop -= 14; }

  function endSpanDrag(commit) {

  /* ---------- the Until button and its menu: keyboard and touch ---------- */

  function untilButton(date, span, hasText) {
    var button = make("button", "span-until");
    button.type = "button";
    button.setAttribute("data-text", hasText ? "true" : "false");
    var words = span ? core.plainText(span.text) : core.plainText(core.lineOf(shown, date).text);
    button.setAttribute("aria-label", "Until, for: " + words);
    button.setAttribute("aria-haspopup", "menu");
    button.setAttribute("aria-expanded", untilMenu && untilMenu.date === date ? "true" : "false");

    button.appendChild(make("span", "", "Until"));
    button.addEventListener("click", function () {
      if (untilMenu && untilMenu.date === date) { closeUntilMenu(true); } else { openUntilMenu(date); }
    });
    return button;
  }

  // The words and the days of the line the menu is for, from what is on screen.
  function untilContext(date) {
    var lead = (monthLayout.rows[date] || EMPTY_ROW).texts[0] || null;
    if (lead) { return { span: lead.span, start: lead.span.start, end: lead.span.end }; }
    return { span: null, start: date, end: date };
  }

  function openUntilMenu(date) {
    closeUntilMenu(false);
    var context = untilContext(date);
    untilMenu = { date: date, view: "days", month: null };
    var row = document.querySelector('.date-row[data-date="' + date + '"]');
    if (row) { row.setAttribute("data-until-open", "true"); }
    drawUntilMenu(context, true);
  }

  function closeUntilMenu(focusBack) {
    var held = untilMenu;
    // The button is focused while its row still shows it, then the row lets go.
    if (held && focusBack) {
      var button = document.querySelector('.date-row[data-date="' + held.date + '"] .span-until');
      if (button) { button.focus(); }
    }
    untilMenu = null;
    var node = document.getElementById("until-menu");
    if (node) { node.remove(); }
    Array.prototype.forEach.call(document.querySelectorAll(".date-row[data-until-open]"), function (r) { r.removeAttribute("data-until-open"); });
    Array.prototype.forEach.call(document.querySelectorAll(".span-until[aria-expanded]"), function (b) { b.setAttribute("aria-expanded", "false"); });
  }

  function untilItem(label, picked, checked, extra) {
    var item = make("button", "", "");

    item.setAttribute("role", "menuitemradio");
    item.setAttribute("aria-checked", checked ? "true" : "false");
    item.appendChild(make("span", "", label));
    if (extra) { item.appendChild(make("span", "pick-word", extra)); }
    if (checked) { item.appendChild(make("span", "pick-word", "✓")); }
    item.addEventListener("click", picked);
    return item;
  }

  function drawUntilMenu(context, focusFirst) {
    var old = document.getElementById("until-menu");
    if (old) { old.remove(); }

    var menu = make("div", "until-menu");
    menu.id = "until-menu";
    menu.setAttribute("role", "menu");
    menu.setAttribute("aria-label", "Until when");

      var inWeek = false;
      for (var n = 1; n <= 7; n += 1) {
        var day = core.addDays(context.start, n);
        if (day === context.end) { inWeek = true; }
        menu.appendChild(untilItem(weekdayDay(day) + " " + fmtMonthShort.format(utc(day)), (function (d) { return function () { choose(d); }; })(day), day === context.end));
      }
      var later = untilItem("Later date…", function () {
        untilMenu.view = "dates";
        untilMenu.month = core.monthOf(context.end > core.addDays(context.start, 7) ? context.end : core.addDays(context.start, 8));
        drawUntilMenu(context, true);

      prev.type = "button";
      prev.setAttribute("aria-label", "Previous month");
      prev.appendChild(icon("i-chevron-left"));
      prev.addEventListener("click", function () { untilMenu.month = core.addMonths(untilMenu.month, -1); drawUntilMenu(context, false); });
      var next = make("button", "icon-button");
      next.type = "button";
      next.setAttribute("aria-label", "Next month");
      next.appendChild(icon("j-chevron-right"));
      next.addEventListener("click", function () { untilMenu.month = core.addMonths(untilMenu.month, 1); drawUntilMenu(context, false); });
      head.appendChild(prev);
      head.appendChild(make("span", "pick-title", monthYear(untilMenu.month)));
      head.appendChild(next);
      menu.appendChild(head);
      var list = make("div", "pick-list");
      var last = core.addDays(context.start, core.MAX_SPAN_DAYS - 1);
      for (var d = 1; d <= core.daysInMonth(untilMenu.month); d += 1) {
        var target = untilMenu.month + "-" + (d < 10 ? "0" : "") + d;

      if (event.key === "ArrowDown") { event.preventDefault(); items[(at + 1) % items.length].focus(); }
      else if (event.key === "ArrowUp") { event.preventDefault(); items[(at - 1 + items.length) % items.length].focus(); }
      else if (event.key === "Home") { event.preventDefault(); items[0].focus(); }
      else if (event.key === "End") { event.preventDefault(); items[items.length - 1].focus(); }
      else if (event.key === "Escape") { event.preventDefault(); event.stopPropagation(); closeUntilMenu(true); }

  }

  // Under the button, or above it when there is no room below.
  function placeUntilMenu() {
    var menu = document.getElementById("until-menu");
    if (!menu || !untilMenu) { return; }
    var button = document.querySelector('.date-row[data-date="' + untilMenu.date + '"] .span-until');
    if (!button) { closeUntilMenu(false); return; }
    var box = button.getBoundingClientRect();
    var height = menu.offsetHeight;
    var below = box.bottom + 4;
    var top = below + height > window.innerHeight - 8 ? Math.max(8, box.top - 4 - height) : below;

  function chooseUntil(date, context, end) {

  document.addEventListener("pointerdown", function (event) {

  }, true);
  window.addEventListener("resize", function () { placeUntilMenu(); });
  $("month-body").addEventListener("scroll", function () { placeUntilMenu(); });

  function wireLine(editor, date, day) {
    var original = null;
    var cancelled = false;
    editor.addEventListener("focus", function () { original = readEditor(editor); cancelled = false; });
    editor.addEventListener("keydown", function (event) {
      if (event.key === "Enter") { event.preventDefault(); editor.blur(); }
      else if (event.key === "Escape") { event.preventDefault(); cancelled = true; drawMarks(editor, original === null ? day.line : original, false); editor.blur(); }
    });
    editor.addEventListener("blur", function () {
      if (original === null) { return; }
      var typed = readEditor(editor);
      var before = original;
      original = null;
      if (cancelled || typed === before) { return; }
      var current = core.lineOf(shown, date);
      submit({ op: "line", date: date, rev: day.lineRev, text: typed }, {
        onFail: function () {
          var row = document.querySelector('.date-row[data-date="' + date + '"] .line-text');
          if (row) { drawMarks(row, typed, false); row.focus(); }
        }
      });
      void current;
    });
  }

  function renderMonth() {
    var inDay = dayView !== null;
    $("month-nav").hidden = inDay;
    $("month-now").hidden = inDay || viewMonth === thisMonth();
    $("day-head").hidden = !inDay;
    $("day-view").hidden = !inDay;
    $("addbar-day").hidden = !inDay;
    if (!inDay) { $("moved-day").hidden = true; }
    $("month-search-wrap").hidden = inDay;
    var searching = !inDay && search.q.trim() !== "";
    $("month-picker-wrap").hidden = inDay || !pickerOpen || searching;
    $("date-rows").hidden = inDay || pickerOpen || searching;
    if (!searching) { $("search-results").hidden = true; $("search-empty").hidden = true; }
    $("month-title").textContent = monthYear(viewMonth);
    $("month-title").setAttribute("aria-expanded", pickerOpen ? "true" : "false");
    $("month-prev").setAttribute("aria-label", "Previous month: " + monthYear(core.addMonths(viewMonth, -1)));
    $("month-next").setAttribute("aria-label", "Next month: " + monthYear(core.addMonths(viewMonth, 1)));
    if (inDay) {
      $("month-empty").hidden = true;
      $("search-results").hidden = true;
      $("search-empty").hidden = true;
      $("day-back-label").textContent = "Back to " + monthName(core.monthOf(dayView));
      $("day-date").textContent = longDate(dayView);
      renderList($("list-day"), $("empty-day"), core.dayList(dayView), EMPTY.day(dayView), "day");
      return;
    }
    if (searching) { $("month-empty").hidden = true; drawSearch(); return; }
    if (pickerOpen) { drawPicker(); $("month-empty").hidden = true; return; }
    var list = $("date-rows");
    var active = document.activeElement;
    var keep = active && list.contains(active) && active.classList.contains("line-text") ? active.closest("li.date-row") : null;
    var refocus = active && list.contains(active) && active.classList.contains("span-until") ? active.closest("li.date-row").getAttribute("data-date") : null;
    var before = {};
    Array.prototype.forEach.call(list.children, function (row) { before[row.getAttribute("data-date")] = row; });
    var file = shown[viewMonth];
    var total = core.daysInMonth(viewMonth);
    var anything = false;
    var made = [];
    monthLayout = core.layoutSpans(spansShown, viewMonth);
    for (var d = 1; d <= total; d += 1) {
      var date = viewMonth + "-" + (d < 10 ? "0" : "") + d;
      var rowSpan = monthLayout.rows[date];
      if (core.dayHas(file, date) || rowSpan.texts.length > 0) { anything = true; }
      if (keep && keep.getAttribute("data-date") === date) { made.push(keep); continue; }
      var signature = dateSignature(date, rowSpan);
      var held = before[date];
      if (held && held._signature === signature) { made.push(held); continue; }
      var row = dateRow(date, rowSpan);
      row._signature = signature;
      made.push(row);
    }
    list.textContent = "";
    made.forEach(function (row) { list.appendChild(row); });
    markSelected();
    if (untilMenu) { placeUntilMenu(); }
    if (refocus) {
      var again = document.querySelector('.date-row[data-date="' + refocus + '"] .span-until');
      if (again) { again.focus(); }
    }
    var empty = $("month-empty");
    empty.hidden = anything;
    if (!anything) { empty.textContent = "Nothing on the calendar for " + monthName(viewMonth) + " yet. Click a date to add a line, or open a date to log it."; }
  }

  function drawPicker() {
    var year = pickerYear === null ? +viewMonth.slice(0, 4) : pickerYear;
    $("year-label").textContent = String(year);
    var host = $("month-picker");
    host.textContent = "";
    for (var m = 1; m <= 12; m += 1) {
      var month = year + "-" + (m < 10 ? "0" : "") + m;
      var b = make("button", "", fmtMonthShort.format(utc(month + "-01")));
      b.type = "button";
      b.setAttribute("aria-label", monthYear(month));
      if (month === viewMonth) { b.setAttribute("aria-current", "true"); }
      b.addEventListener("click", (function (target) { return function () { pickMonth(target); }; })(month));
      host.appendChild(b);
    }
  }

  function pickMonth(month) {
    loadMonths([month]).then(function (ok) {
      if (!ok) { return; }
      viewMonth = month;
      pickerOpen = false;
      pickerYear = null;
      renderAll();
      scrollToToday();
      $("month-title").focus();
    });
  }

  function scrollToToday() {
    var body = $("month-body");
    if (!body) { return; }
    if (viewMonth !== thisMonth()) { body.scrollTop = 0; return; }
    var row = document.querySelector('.date-row[data-date="' + today + '"]');
    // A panel that is not on screen (another phone tab) has no position yet.
    if (row && row.offsetParent !== null) {
      body.scrollTop = Math.max(0, row.getBoundingClientRect().top - body.getBoundingClientRect().top + body.scrollTop - 8);
      monthPositioned = true;
    }
  }

  function openDay(date) {
    // Today and tomorrow have their own panels. There is only ever one editable
    // copy of a list on screen, so a click goes there instead.
    if (date === today || date === tomorrow()) {
      var key = date === today ? "today" : "tomorrow";
      showPanel(key);
      var bar = addBars[key];
      if (bar) { bar.editor.focus(); }
      return;
    }
    loadMonths([core.monthOf(date)]).then(function (ok) {
      if (!ok) { return; }
      dayView = date;
      history.pushState({ day: date }, "", "#d/" + date);
      renderAll();
      addBars.day.editor.focus();
    });
  }

  function closeDay(fromHistory) {
    if (dayView === null) { return; }
    dayView = null;
    if (!fromHistory && /^#d\//.test(location.hash)) { history.back(); }
    renderAll();
    scrollToToday();
  }

  window.addEventListener("popstate", function () {
    var kept = /^#done(?:\/(\d{4}-\d{2}))?$/.exec(location.hash);
    if (kept && signedIn) { openDone(doneMonthFrom(kept[1]), false); return; }
    if (done.open) { closeDone(true); }
    var match = /^#d\/(\d{4}-\d{2}-\d{2})$/.exec(location.hash);
    if (match && core.isDate(match[1])) {
      loadMonths([core.monthOf(match[1])]).then(function (ok) { if (ok) { dayView = match[1]; renderAll(); } });
    } else {
      closeDay(true);
    }
  });

  $("day-back").addEventListener("click", function () { closeDay(false); });
  $("panel-month").addEventListener("keydown", function (event) {
    if (event.key !== "Escape") { return; }
    if (pickerOpen) { pickerOpen = false; renderAll(); $("month-title").focus(); }
    else if (dayView !== null && event.target.closest && !event.target.closest("[contenteditable]")) { closeDay(false); }
  });

  function step(delta) {
    var target = core.addMonths(viewMonth, delta);
    loadMonths([target]).then(function (ok) { if (!ok) { return; } viewMonth = target; renderAll(); scrollToToday(); });
  }
  $("month-prev").addEventListener("click", function () { step(-1); });
  $("month-next").addEventListener("click", function () { step(1); });
  $("month-now").addEventListener("click", function () {
    viewMonth = thisMonth();
    renderAll();
    scrollToToday();
  });
  $("month-title").addEventListener("click", function () {
    pickerOpen = !pickerOpen;
    pickerYear = +viewMonth.slice(0, 4);
    renderAll();
  });
  $("year-prev").addEventListener("click", function () { pickerYear -= 1; drawPicker(); });
  $("year-next").addEventListener("click", function () { pickerYear += 1; drawPicker(); });

  /* ---------- searching the calendar ----------
     The first search in a window reads everything once (every month the page does
     not hold, every span), and the page keeps it, so the next search costs nothing.
     After five minutes the next search reads again. Results are worked out by
     core.searchCalendar from what the page holds, edits included. */

  var searchBox = $("month-search");

  searchBox.addEventListener("input", function () {
    search.q = searchBox.value;
    if (search.q.trim() === "") { renderAll(); return; }
    findInCalendar();
  });
  searchBox.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && searchBox.value !== "") {
      event.preventDefault();
      event.stopPropagation();
      searchBox.value = "";
      search.q = "";
      renderAll();
    }
  });

  function loadEverything() {
    var gen = generation;
    var held = Object.keys(confirmed);
    var skip = held.length <= 36 ? "&skip=" + held.join(",") : "";
    search.loading = true;
    return request("/api/journal?view=all" + skip).then(function (response) {
      if (!response.ok) { throw new Error("search"); }
      return readJson(response);
    }).then(function (body) {
      if (gen !== generation) { return false; }
      takeMonths(body.months);
      takeSpans(body.spans);
      recompute();
      search.loaded = true;
      search.at = Date.now();
      search.loading = false;
      return true;
    }).catch(function () {
      if (gen === generation) { search.loading = false; }
      showFlash("Could not search the calendar. Check your connection and try again.", null);
      return false;
    });
  }

  function findInCalendar() {
    if (search.q.trim() === "") { return; }
    if (search.loaded && Date.now() - search.at < REFRESH_MIN_MS) { renderAll(); return; }
    if (search.loading) { return; }
    search.loading = true;
    renderAll();
    loadEverything().then(function () { renderAll(); });
  }

  function resultDate(r) {
    return r.date ? fmtWeekday.format(utc(r.date)) + " " + shortDate(r.date) + " " + r.date.slice(0, 4) : monthYear(r.month);
  }

  function drawSearch() {
    var host = $("search-results");
    var empty = $("search-empty");
    host.textContent = "";
    var text = search.q.trim();
    if (!search.loaded) {
      host.hidden = true;
      empty.hidden = !search.loading;
      empty.textContent = "Searching.";
      return;
    }
    var found = core.searchCalendar(shown, spansShown, text, today);
    host.hidden = found.length === 0;
    empty.hidden = found.length !== 0;
    empty.textContent = "Nothing in the calendar contains " + text + ".";
    found.forEach(function (r) {
      var li = make("li");
      var b = make("button", "search-result");
      b.type = "button";
      b.setAttribute("aria-label", "Open " + resultDate(r) + ": " + core.plainText(r.text));
      var meta = make("span", "result-meta");
      meta.appendChild(make("span", "", resultDate(r)));
      meta.appendChild(make("span", "", r.kind === "span" ? "Span to " + shortDate(r.end) : r.source));
      var words = make("span", "result-text");
      drawMarks(words, r.text, false);
      b.appendChild(meta);
      b.appendChild(words);
      b.addEventListener("click", function () { openResult(r); });
      li.appendChild(b);
      host.appendChild(li);
    });
  }

  // A result takes Month to its date and opens that date's log. The search stays
  // as it was, so Back from the log shows the results again.
  function openResult(r) {
    viewMonth = r.month;
    pickerOpen = false;
    pickerYear = null;
    if (r.date) { openDay(r.date); return; }
    if (r.month === thisMonth()) { showPanel("migrate"); }
    renderAll();
  }

  /* ---------- the Done list ----------
     A full-window view of the tasks completed in one month, newest first and
     grouped by the day they were ticked. Read only. It has its own address,
     #done/YYYY-MM, so Back and a refresh keep it. */

  function doneMonthFrom(month) {
    return month && core.isMonth(month) && month <= thisMonth() ? month : thisMonth();
  }

  // The panels or the Done view, whichever the page is showing.
  function applyView() {
    var inApp = signedIn;
    $("app").hidden = !inApp || done.open;
    $("tabbar").hidden = !inApp || done.open;
    $("done").hidden = !inApp || !done.open;
    $("done-open").setAttribute("aria-current", inApp && done.open ? "page" : "false");
  }

  function openDone(month, push) {
    if (!signedIn) { return; }
    hideFlash();
    done.month = month;
    if (push) {
      history.pushState({ done: month }, "", "#done/" + month);
      done.pushed = true;
    }
    done.open = true;
    applyView();
    drawDone();
    $("done-heading").focus();
    loadDone();
  }

  function closeDone(fromHistory) {
    if (!done.open) { return; }
    done.open = false;
    done.ask += 1;
    applyView();
    if (!fromHistory) {
      if (done.pushed) { history.back(); } else if (/^#done/.test(location.hash)) { history.replaceState(null, "", location.pathname); }
    }
    done.pushed = false;
    renderAll();
    scrollToToday();
    $("done-open").focus();
  }

  // What is waiting to be saved is saved first, so a task just ticked is in the list.
  function loadDone() {
    var month = done.month;
    var held = done.cache[month];
    if (held && Date.now() - held.at < REFRESH_MIN_MS) {
      done.items = held.items;
      done.state = "ready";
      drawDone();
      return;
    }
    done.state = "loading";
    drawDone();
    var ask = (done.ask += 1);
    var gen = generation;
    drained().then(function () {
      return request("/api/journal?view=done&month=" + month);
    }).then(function (response) {
      if (!response.ok) { throw new Error("done"); }
      return readJson(response);
    }).then(function (body) {
      if (gen !== generation || ask !== done.ask || !done.open) { return; }
      done.items = Array.isArray(body.items) ? body.items : [];
      done.cache[month] = { items: done.items, at: Date.now() };
      done.state = "ready";
      drawDone();
    }).catch(function () {
      if (gen !== generation || ask !== done.ask || !done.open) { return; }
      done.state = "error";
      drawDone();
      showFlash("Could not load the Done list. Check your connection and try again.", { label: "Try again", run: function () { loadDone(); return true; } });
    });
  }

  function logLabel(list) {
    var parsed = core.parseList(list);
    return parsed.kind === "day" ? "Log: " + fmtWeekday.format(utc(parsed.date)) + " " + shortDate(parsed.date) : "Log: Migrate, " + monthYear(parsed.month);
  }

  function drawDone() {
    var month = done.month;
    $("done-month").textContent = monthYear(month);
    $("done-prev").setAttribute("aria-label", "Previous month: " + monthYear(core.addMonths(month, -1)));
    $("done-next").setAttribute("aria-label", "Next month: " + monthYear(core.addMonths(month, 1)));
    $("done-next").disabled = month >= thisMonth();
    var host = $("done-groups");
    host.textContent = "";
    var groups = done.state === "ready" ? core.doneGroups(done.items, month) : [];
    $("done-loading").hidden = done.state !== "loading";
    $("done-empty").hidden = done.state !== "ready" || groups.length !== 0;
    $("done-empty").textContent = "Nothing completed in " + monthYear(month) + ".";
    groups.forEach(function (group) {
      host.appendChild(make("h3", "done-day", group.date === null ? "Date not recorded" : longDate(group.date)));
      var list = make("ul", "done-list");
      group.items.forEach(function (item) {
        var li = make("li", "done-row");
        var mark = make("span", "bullet");
        mark.appendChild(icon("j-done"));
        var text = make("span", "done-text");
        drawMarks(text, item.text, false);
        li.appendChild(mark);
        li.appendChild(text);
        li.appendChild(make("span", "done-log", logLabel(item.list)));
        list.appendChild(li);
      });
      host.appendChild(list);
    });
  }

  function stepDone(delta) {
    var target = core.addMonths(done.month, delta);
    if (target > thisMonth()) { return; }
    done.month = target;
    history.replaceState({ done: target }, "", "#done/" + target);
    loadDone();
  }

  $("done-open").addEventListener("click", function () {
    if (done.open) { return; }
    openDone(thisMonth(), true);
  });
  $("done-back").addEventListener("click", function () { closeDone(false); });
  $("done-prev").addEventListener("click", function () { stepDone(-1); });
  $("done-next").addEventListener("click", function () { stepDone(1); });
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && done.open) { event.preventDefault(); closeDone(false); }
  });

  /* ---------- Quick notes ---------- */

  var quickEditor = $("quick-editor");
  wireEditor(quickEditor);
  wireBullets(quickEditor);

  function setQuickStatus(state, word) {
    var status = $("quick-status");
    if (!status) { return; }
    status.setAttribute("data-state", state);
    status.textContent = word;
  }

  quickEditor.addEventListener("input", function () {
    quick.dirty = true;
    quick.failed = false;
    setQuickStatus("unsaved", "Not saved yet");
    scheduleQuickSave();
  });
  quickEditor.addEventListener("blur", function () { if (quick.dirty) { saveQuick(); } });

  function scheduleQuickSave() {
    var at = Date.now();
    if (!quick.dirtySince) { quick.dirtySince = at; }
    var wait = Math.max(0, Math.min(SAVE_DELAY_MS, quick.dirtySince + SAVE_MAX_WAIT_MS - at));
    clearTimeout(quick.timer);
    quick.timer = setTimeout(function () { saveQuick(); }, wait);
  }

  function saveQuick() {
    clearTimeout(quick.timer);
    quick.timer = null;
    quick.dirtySince = 0;
    // A save already on its way is the one to wait for, so a caller that needs to
    // know (sign out) gets the real answer and not a guess.
    if (quick.saving) { return quick.promise; }
    if (!quick.dirty || !signedIn) { return Promise.resolve(!quick.dirty); }
    quick.saving = true;
    var text = readEditor(quickEditor);
    var gen = generation;
    setQuickStatus("saving", "Saving");
    quick.promise = request("/api/journal?part=quick", { method: "PUT", headers: { "Content-Type": "text/plain; charset=utf-8", "X-Base-Updated": quick.base }, body: text }).then(function (response) {
      return readJson(response).then(function (body) { return { status: response.status, body: body }; });
    }).then(function (answer) {
      if (gen !== generation) { return false; }
      quick.saving = false;
      if (answer.status === 200) {
        quick.base = answer.body.updatedAt;
        // More was typed while this was on its way: save that too.
        if (readEditor(quickEditor) !== text) { quick.dirty = true; scheduleQuickSave(); setQuickStatus("unsaved", "Not saved yet"); return false; }
        quick.dirty = false;
        setQuickStatus("saved", "Saved");
        return true;
      }
      if (answer.status === 401) { return false; }
      quick.failed = true;
      setQuickStatus("failed", "Not saved");
      if (answer.status === 409) {
        showFlash(answer.body.error, { label: "Reload", run: function () { return reloadQuick(); } });
      } else {
        showFlash(answer.body && answer.body.error ? answer.body.error : NOT_CHANGED, null);
      }
      return false;
    }).catch(function () {
      if (gen !== generation) { return false; }
      quick.saving = false;
      quick.failed = true;
      setQuickStatus("failed", "Not saved");
      showFlash(NOT_CHANGED, null);
      return false;
    });
    return quick.promise;
  }

  // After a clash the person chooses: reloading replaces what is typed with what
  // the other device saved. Until they do, the typed text stays on screen.
  function reloadQuick() {
    return request("/api/journal?view=home&today=" + today).then(readJson).then(function (body) {
      if (!body.quick || core.laterStamp(quick.base, body.quick.updatedAt)) { return false; }
      quick.base = body.quick.updatedAt;
      drawMarks(quickEditor, body.quick.text, true);
      quick.dirty = false;
      quick.failed = false;
      setQuickStatus("saved", "Saved");
      return true;
    }).catch(function () { return false; });
  }

  function takeQuick(fresh) {
    // Never replaces text that is being typed or that has not been saved, and never
    // draws an older save over a newer one.
    if (quick.dirty || quick.saving || document.activeElement === quickEditor) { return; }
    if (!core.laterStamp(fresh.updatedAt, quick.base)) { return; }
    quick.base = fresh.updatedAt;
    drawMarks(quickEditor, fresh.text, true);
  }

  Array.prototype.forEach.call(document.querySelectorAll("#panel-quick .fmt-button"), function (b) {
    b.addEventListener("pointerdown", function (event) { event.preventDefault(); });
    b.addEventListener("click", function () {
      if (b.classList.contains("fmt-bullet")) { toggleBulletLine(quickEditor); }
      else { format(b.classList.contains("fmt-bold") ? "bold" : "strikeThrough", quickEditor); }
    });
  });

  /* ---------- panels and tabs ---------- */

  var monthPositioned = false;

  function showPanel(name) {
    PANELS.forEach(function (key) {
      var panel = $("panel-" + key);
      if (panel) { panel.setAttribute("data-active", key === name ? "true" : "false"); }
    });
    Array.prototype.forEach.call(document.querySelectorAll("#tabbar button"), function (b) {
      b.setAttribute("aria-selected", b.getAttribute("data-panel") === name ? "true" : "false");
    });
    try { localStorage.setItem(TAB_KEY, name); } catch (e) { /* not saved */ }
    if (name === "month" && !monthPositioned) { scrollToToday(); }
  }

  Array.prototype.forEach.call(document.querySelectorAll("#tabbar button"), function (b) {
    b.addEventListener("click", function () { showPanel(b.getAttribute("data-panel")); });
  });

  /* ---------- drawing everything ---------- */

  function renderAll() {
    if (!signedIn) { return; }
    // A panel that is not on the page is skipped, so each one draws alone.
    if ($("panel-today")) { renderToday(); }
    if ($("panel-tomorrow")) { renderTomorrow(); }
    if ($("panel-migrate")) { renderMigrate(); }
    if ($("panel-month")) { renderMonth(); }
  }

  function buildBars() {
    buildAddBar($("addbar-today"), "today", function () { return core.dayList(today); });
    buildAddBar($("addbar-tomorrow"), "tomorrow", function () { return core.dayList(tomorrow()); });
    buildAddBar($("addbar-migrate"), "migrate", function () { return core.migrateList(thisMonth()); });
    buildAddBar($("addbar-day"), "day", function () { return dayView ? core.dayList(dayView) : null; });
  }
  buildBars();

  /* ---------- loading and keeping up to date ---------- */

  function applyHome(body, replaceQuick, light) {
    done.cache = {};
    takeMonths(body.months);
    takeSpans(body.spans);
    // A light answer carries only this month's files, so the earlier months the
    // strip already holds stay in it.
    stripMonths = light ? stripMonths.concat(Object.keys(body.months).filter(function (m) { return stripMonths.indexOf(m) === -1; })) : Object.keys(body.months);
    recompute();
    if (body.quick) {
      if (replaceQuick) { quick.base = body.quick.updatedAt; drawMarks(quickEditor, body.quick.text, true); }
      else { takeQuick(body.quick); }
    }
  }

  function loadHome() {
    var gen = generation;
    return request("/api/journal?view=home&today=" + today).then(function (response) {
      if (!response.ok) { throw new Error("home"); }
      return readJson(response);
    }).then(function (body) {
      if (gen !== generation) { return false; }
      applyHome(body, true);
      lastRefresh = Date.now();
      return true;
    });
  }

  // Asks again and draws what is new, unless something is half done on this
  // page. It only ever redraws. It never moves, migrates or drops anything.
  function refresh(force) {
    if (!signedIn) { return Promise.resolve(false); }
    var busy = pending.length > 0 || sending;
    var editing = document.activeElement && document.activeElement.matches && document.activeElement.matches(".entry-text, .line-text");
    if (!force && (busy || editing)) { return Promise.resolve(false); }
    if (busy) { return Promise.resolve(false); }
    var gen = generation;
    var rolled = londonDate();
    var rolledOver = rolled !== today;
    if (rolledOver) { today = rolled; }
    // Only the month being looked at is asked for again; the earlier months the
    // morning strip read when the page opened are not.
    var extra = viewMonth !== thisMonth() && confirmed[viewMonth] ? [viewMonth] : [];
    return request("/api/journal?view=home" + (rolledOver ? "" : "&light=1") + "&today=" + today).then(function (response) {
      if (!response.ok) { throw new Error("home"); }
      return readJson(response);
    }).then(function (body) {
      if (gen !== generation || pending.length > 0 || sending) { return false; }
      var others = extra.filter(function (m) { return !body.months[m]; });
      applyHome(body, false, !rolledOver);
      if (others.length === 0) { return true; }
      return request("/api/journal?view=months&months=" + others.slice(0, 5).join(",")).then(readJson).then(function (more) {
        if (gen !== generation || pending.length > 0 || sending) { return false; }
        takeMonths(more.months);
        takeSpans(more.spans);
        recompute();
        return true;
      });
    }).then(function (ok) {
      if (ok !== false) { lastRefresh = Date.now(); renderAll(); }
      return ok !== false;
    }).catch(function () { return false; });
  }

  // Asks again only when the window has just been brought back, is visible, and
  // either five minutes have passed since it last asked or the date has changed.
  function refreshOnReturn() {
    if (!signedIn || document.visibilityState !== "visible") { return; }
    if (londonDate() !== today) { refresh(true); return; }
    if (Date.now() - lastRefresh >= REFRESH_MIN_MS) { refresh(false); }
  }

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") { refreshOnReturn(); }
    else if (document.visibilityState === "hidden" && quick.dirty) { saveQuick(); }
  });
  window.addEventListener("focus", refreshOnReturn);

  /* ---------- sign in, sign out ---------- */

  function show(name) {
    $("boot").hidden = true;
    $("login").hidden = name !== "login";
    $("boot-main").hidden = name === "app";
    $("bar-actions").hidden = name !== "app";
    $("sign-out").hidden = name !== "app";
    signedIn = name === "app";
    applyView();
  }

  // Nothing but the wordmark and one line of text.
  function showOnly(message) {
    signedIn = false;
    $("login").hidden = true;
    $("bar-actions").hidden = true;
    $("sign-out").hidden = true;
    done.open = false;
    applyView();
    hideFlash();
    $("boot-main").hidden = false;
    $("boot").textContent = message;
    $("boot").hidden = false;
  }

  // Every entry, every typed character and every copy the page holds goes.
  function clearContent() {
    generation += 1;
    clearTimeout(quick.timer);
    confirmed = {};
    stripMonths = [];
    pending = [];
    shown = {};
    spansConfirmed = {};
    spansShown = {};
    selectedSpan = null;
    if (spanDrag) { endSpanDrag(false); }
    closeUntilMenu(false);
    monthLayout = { rows: {}, overflow: [] };
    sending = false;
    dayView = null;
    pickerOpen = false;
    pickerYear = null;
    monthPositioned = false;
    ui = { openMove: null, picking: null, movedOpen: {} };
    quick = { text: "", base: "none", dirty: false, saving: false, timer: null, failed: false, promise: null };
    search = { q: "", loaded: false, loading: false, at: 0 };
    done = { open: false, month: null, state: "idle", items: [], cache: {}, pushed: false, ask: 0 };
    $("month-search").value = "";
    ["search-results", "done-groups"].forEach(function (id) { $(id).textContent = ""; });
    ["search-empty", "done-empty", "done-month"].forEach(function (id) { $(id).textContent = ""; });
    applyView();
    activeEditor = null;
    ["list-today", "list-tomorrow", "list-migrate", "list-day", "date-rows", "month-picker", "strip"].forEach(function (id) { $(id).textContent = ""; });
    ["date-today", "date-tomorrow", "date-migrate", "day-date"].forEach(function (id) { $(id).textContent = ""; });
    Object.keys(addBars).forEach(function (key) { addBars[key].editor.textContent = ""; });
    quickEditor.textContent = "";
    $("password").value = "";
    $("flash-text").textContent = "";
    ["empty-today", "empty-tomorrow", "empty-migrate", "empty-day", "month-empty"].forEach(function (id) { $(id).textContent = ""; });
    setQuickStatus("saved", "Saved");
    hideFlash();
  }

  function goToLogin() {
    clearContent();
    show("login");
    $("password").focus();
  }

  $("login-form").addEventListener("submit", function (event) {
    event.preventDefault();
    var button = $("login-submit");
    var errorEl = $("login-error");
    button.disabled = true;
    errorEl.hidden = true;
    request("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: $("password").value })
    }).then(function (response) {
      button.disabled = false;
      if (response.ok) { $("password").value = ""; start(); return; }
      errorEl.textContent = "That password is incorrect.";
      errorEl.hidden = false;
      $("password").select();
    }).catch(function () {
      button.disabled = false;
      errorEl.textContent = "Could not reach the server. Try again.";
      errorEl.hidden = false;
    });
  });

  // Sign out waits for what is on its way. If a change or the quick notes cannot
  // be saved there is no offer to leave anyway: the person stays signed in with
  // the text and the message on screen.
  function signOut() {
    var buttons = [$("sign-out")];
    buttons.forEach(function (b) { b.disabled = true; });
    var enable = function () { buttons.forEach(function (b) { b.disabled = false; }); };
    Promise.all([drained(), quick.dirty ? saveQuick() : Promise.resolve(true)]).then(function (results) {
      if (!results[1] && quick.dirty) { throw new Error("unsaved"); }
      return fetch("/api/session", { method: "DELETE", credentials: "same-origin" });
    }).then(function (response) {
      enable();
      if (!response.ok && response.status !== 401) { throw new Error("sign out"); }
      history.replaceState(null, "", location.pathname);
      goToLogin();
    }).catch(function () {
      enable();
      showFlash("Could not sign out because something has not been saved. You are still signed in. Try again.", null);
    });
  }
  $("sign-out").addEventListener("click", signOut);

  // A browser may keep this page in its back-forward cache and show it again on
  // Back exactly as it was left. So the page empties itself as it is left: what
  // the cache keeps holds no entry and shows only the wordmark. On return it asks
  // the server before showing anything.
  window.addEventListener("pagehide", function () {
    clearContent();
    showOnly("Loading.");
  });
  window.addEventListener("pageshow", function (event) {
    if (!event.persisted) { return; }
    request("/api/session").then(function (response) {
      if (response.ok) { start(); } else { goToLogin(); }
    }).catch(function () { showOnly("Could not reach the server. Reload to try again."); });
  });

  function start() {
    today = londonDate();
    viewMonth = thisMonth();
    var tab = "today";
    try { tab = localStorage.getItem(TAB_KEY) || "today"; } catch (e) { /* the phone opens on Today */ }
    if (PANELS.indexOf(tab) === -1) { tab = "today"; }
    loadHome().then(function (ok) {
      if (!ok) { return; }
      show("app");
      showPanel(tab);
      renderAll();
      scrollToToday();
      var match = /^#d\/(\d{4}-\d{2}-\d{2})$/.exec(location.hash);
      if (match && core.isDate(match[1]) && match[1] !== today && match[1] !== tomorrow()) {
        loadMonths([core.monthOf(match[1])]).then(function (loaded) { if (loaded) { dayView = match[1]; renderAll(); } });
      }
      var kept = /^#done(?:\/(\d{4}-\d{2}))?$/.exec(location.hash);
      if (kept) { openDone(doneMonthFrom(kept[1]), false); }
    }).catch(function () {
      showOnly(NOT_LOADED);
    });
  }

  // The date is checked as the window sits open, so the marks and the headings
  // are right in the morning without a reload.
  setInterval(function () {
    if (!signedIn) { return; }
    if (document.visibilityState === "visible" && londonDate() !== today) { refresh(true); }
  }, 30000);

  request("/api/session").then(function (response) {
    if (response.ok) { start(); } else { goToLogin(); }
  }).catch(function () {
    $("boot").textContent = "Could not reach the server. Reload to try again.";
  });
})();
</script>
</body>
</html>
