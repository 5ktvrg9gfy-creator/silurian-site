<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262422" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Journal">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Journal</title>
<link rel="manifest" href="/journal/manifest.webmanifest">
<link rel="icon" href="/journal/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/journal/apple-touch-icon.png">
<script id="theme-init">
(function () {
  try {
    var saved = localStorage.getItem("silurian-notes-theme");
    if (saved === "light" || saved === "dark") { document.documentElement.setAttribute("data-theme", saved); }
  } catch (e) { /* storage is blocked: the page follows the device */ }
})();
</script>
<link rel="stylesheet" href="/tokens.css">
<style>
  /* Light theme and page sizes. The only place a colour or a font size is written. */
  :root {
    color-scheme: light dark;
    --notes-ground: #faf8f5;
    --notes-panel: #f1ede7;
    --notes-field: #ffffff;
    --notes-line: #e2dcd3;
    --notes-line-soft: #ebe6df;
    --notes-hover: #ede8e1;
    --notes-selected: #e4dccf;
    --notes-scrim: rgba(26, 25, 24, 0.4);
    --notes-ink: #2f2d2b;
    --notes-strong: #1a1918;
    --notes-muted: #66615f;
    --notes-icon: #4a4744;
    --notes-accent: #ec6917;
    --notes-on-accent: #1a1918;
    --notes-good: #356b46;
    --notes-warn: #9a5a12;
    --notes-bad: #a52a1f;
    --notes-peel-yellow: #fcf0b8;
    --notes-peel-yellow-hover: #f6e294;
    --notes-peel-yellow-selected: #ecd47a;
    --notes-peel-yellow-field: #fef9e3;
    --notes-peel-yellow-line: #ecd47a;
    --notes-peel-green: #e0f0dc;
    --notes-peel-green-hover: #cde6c8;
    --notes-peel-green-selected: #b9d9b3;
    --notes-peel-green-field: #f3f9f1;
    --notes-peel-green-line: #b9d9b3;
    --notes-peel-pink: #fbe0e7;
    --notes-peel-pink-hover: #f5ccd8;
    --notes-peel-pink-selected: #ecb6c6;
    --notes-peel-pink-field: #fdf3f5;
    --notes-peel-pink-line: #ecb6c6;
    --notes-peel-ink: #2f2d2b;
    --notes-peel-strong: #1a1918;
    --notes-peel-muted: #66615f;
    --notes-peel-icon: #4a4744;
    --notes-peel-bad: #a52a1f;
    --notes-peel-focus: #1a1918;

    --notes-header-height: 65px;
    --notes-size-12: 12px;
    --notes-size-13: 13px;
    --notes-size-14: 14px;
    --notes-size-15: 15px;
    --notes-size-18: 18px;
    --notes-size-30: 30px;
  }
  :root[data-theme="light"] { color-scheme: light; }

  /* Dark theme, following the device when no choice is saved. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --notes-ground: #262422;
      --notes-panel: #1f1d1c;
      --notes-field: #262422;
      --notes-line: #3a3735;
      --notes-line-soft: #33302e;
      --notes-hover: #302d2b;
      --notes-selected: #3d3936;
      --notes-scrim: rgba(0, 0, 0, 0.6);
      --notes-ink: #e3dfdd;
      --notes-strong: #f5f2ef;
      --notes-muted: #9f9893;
      --notes-icon: #cfcac6;
      --notes-accent: #ec6917;
      --notes-on-accent: #1a1918;
      --notes-good: #6fbf86;
      --notes-warn: #e8a54b;
      --notes-bad: #f0857a;
      --notes-peel-yellow: #fcf0b8;
      --notes-peel-yellow-hover: #f6e294;
      --notes-peel-yellow-selected: #ecd47a;
      --notes-peel-yellow-field: #fef9e3;
      --notes-peel-yellow-line: #ecd47a;
      --notes-peel-green: #e0f0dc;
      --notes-peel-green-hover: #cde6c8;
      --notes-peel-green-selected: #b9d9b3;
      --notes-peel-green-field: #f3f9f1;
      --notes-peel-green-line: #b9d9b3;
      --notes-peel-pink: #fbe0e7;
      --notes-peel-pink-hover: #f5ccd8;
      --notes-peel-pink-selected: #ecb6c6;
      --notes-peel-pink-field: #fdf3f5;
      --notes-peel-pink-line: #ecb6c6;
      --notes-peel-ink: #2f2d2b;
      --notes-peel-strong: #1a1918;
      --notes-peel-muted: #66615f;
      --notes-peel-icon: #4a4744;
      --notes-peel-bad: #a52a1f;
      --notes-peel-focus: #1a1918;
    }
  }

  /* Dark theme, chosen with the switch. Same values as the block above. */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --notes-ground: #262422;
    --notes-panel: #1f1d1c;
    --notes-field: #262422;
    --notes-line: #3a3735;
    --notes-line-soft: #33302e;
    --notes-hover: #302d2b;
    --notes-selected: #3d3936;
    --notes-scrim: rgba(0, 0, 0, 0.6);
    --notes-ink: #e3dfdd;
    --notes-strong: #f5f2ef;
    --notes-muted: #9f9893;
    --notes-icon: #cfcac6;
    --notes-accent: #ec6917;
    --notes-on-accent: #1a1918;
    --notes-good: #6fbf86;
    --notes-warn: #e8a54b;
    --notes-bad: #f0857a;
    --notes-peel-yellow: #fcf0b8;
    --notes-peel-yellow-hover: #f6e294;
    --notes-peel-yellow-selected: #ecd47a;
    --notes-peel-yellow-field: #fef9e3;
    --notes-peel-yellow-line: #ecd47a;
    --notes-peel-green: #e0f0dc;
    --notes-peel-green-hover: #cde6c8;
    --notes-peel-green-selected: #b9d9b3;
    --notes-peel-green-field: #f3f9f1;
    --notes-peel-green-line: #b9d9b3;
    --notes-peel-pink: #fbe0e7;
    --notes-peel-pink-hover: #f5ccd8;
    --notes-peel-pink-selected: #ecb6c6;
    --notes-peel-pink-field: #fdf3f5;
    --notes-peel-pink-line: #ecb6c6;
    --notes-peel-ink: #2f2d2b;
    --notes-peel-strong: #1a1918;
    --notes-peel-muted: #66615f;
    --notes-peel-icon: #4a4744;
    --notes-peel-bad: #a52a1f;
    --notes-peel-focus: #1a1918;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--notes-ground);
    color: var(--notes-ink);
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: var(--notes-size-15);
    line-height: 1.5;
  }

  .icon {
    display: block;
    width: 20px;
    height: 20px;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  /* ---------- header ---------- */

  .bar {
    position: sticky;
    top: 0;
    z-index: 30;
    height: var(--notes-header-height);
    background: var(--notes-panel);
    border-bottom: 1px solid var(--notes-line-soft);
  }
  .bar-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px 16px;
    height: 100%;
    padding: 0 16px;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .mark { display: block; width: 26px; height: auto; aspect-ratio: 200 / 290; flex: none; }
  .wordmark {
    margin: 0;
    font-family: "Archivo", system-ui, sans-serif;
    font-size: var(--notes-size-18);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--notes-strong);
    white-space: nowrap;
  }
  .bar-right { display: flex; align-items: center; gap: 8px; }

  /* ---------- buttons ---------- */

  button, a.button-link {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 36px;
    padding: 4px 12px;
    border: 1px solid var(--notes-line);
    border-radius: 8px;
    background: var(--notes-ground);
    color: var(--notes-ink);
    font: inherit;
    font-size: var(--notes-size-14);
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }
  button:hover, a.button-link:hover { background: var(--notes-hover); }
  button.primary {
    border: 0;
    background: var(--notes-accent);
    color: var(--notes-on-accent);
  }
  button.primary:hover { background: var(--notes-accent); filter: brightness(0.92); }
  button.icon-button {
    width: 36px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--notes-icon);
  }
  button.icon-button:hover { background: var(--notes-hover); }
  button.quiet {
    border: 0;
    background: transparent;
  }
  button.quiet:hover { background: var(--notes-hover); }
  button:disabled { cursor: default; opacity: 0.55; }
  /* A touch screen gets 44px targets everywhere a finger lands. */
  @media (pointer: coarse) {
    button, a.button-link { min-height: 44px; }
    button.icon-button { width: 44px; }
  }

  button:focus-visible, input:focus-visible, a:focus-visible,
  .editor-line:focus-visible, .entry-text:focus-visible, .line-text:focus-visible, .quick-editor:focus-visible {
    outline: 2px solid var(--notes-accent);
    outline-offset: 2px;
  }

  /* One icon at a time in the theme switch: the moon on a light page, the sun on a dark one. */
  .theme-switch .icon-sun { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .theme-switch .icon-sun { display: block; }
    :root:not([data-theme="light"]) .theme-switch .icon-moon { display: none; }
  }
  :root[data-theme="dark"] .theme-switch .icon-sun { display: block; }
  :root[data-theme="dark"] .theme-switch .icon-moon { display: none; }

  /* ---------- sign in ---------- */

  main { padding: 24px 16px 48px; }
  .lead { margin: 0 0 16px; color: var(--notes-muted); }
  h1 {
    margin: 0 0 16px;
    font-size: var(--notes-size-30);
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: var(--notes-strong);
  }
  .login-card {
    max-width: 380px;
    padding: 24px;
    border: 1px solid var(--notes-line);
    border-radius: 8px;
    background: var(--notes-panel);
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-size: var(--notes-size-12);
    font-weight: 600;
    color: var(--notes-muted);
  }
  input[type="password"] {
    appearance: none;
    width: 100%;
    min-height: 44px;
    padding: 8px 12px;
    border: 1px solid var(--notes-line);
    border-radius: 8px;
    background: var(--notes-field);
    color: var(--notes-ink);
    font: inherit;
  }
  .form-actions { margin-top: 14px; }
  .message { margin: 0 0 16px; font-weight: 600; color: var(--notes-bad); }

  /* ---------- message bar ---------- */

  .flash {
    position: fixed;
    top: calc(var(--notes-header-height) + 8px);
    left: 0;
    right: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px 12px;
    width: min(620px, calc(100% - 16px));
    margin: 0 auto;
    padding: 4px 4px 4px 12px;
    border: 1px solid var(--notes-line);
    border-radius: 8px;
    background: var(--notes-panel);
  }
  .flash p { margin: 0; padding: 4px 0; }
  .flash-actions { display: flex; flex: none; gap: 4px; }

  /* ---------- panels ---------- */

  #app { min-width: 0; }
  .panels { position: relative; display: grid; gap: 12px; padding: 12px; }
  .panel {
    container: panel / inline-size;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    border: 1px solid var(--notes-line);
    border-radius: 8px;
    background: var(--notes-panel);
    overflow: hidden;
  }
  #panel-month { grid-area: month; }
  #panel-today { grid-area: today; }
  #panel-tomorrow { grid-area: tomorrow; }
  #panel-migrate { grid-area: migrate; }
  #panel-quick { grid-area: quick; }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 52px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--notes-line-soft);
  }
  .panel-title {
    margin: 0;
    font-size: var(--notes-size-18);
    font-weight: 700;
    line-height: 1.2;
    color: var(--notes-strong);
  }
  .panel-date { font-size: var(--notes-size-13); color: var(--notes-muted); text-align: right; }
  .panel-body { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 4px; }

  .empty {
    margin: 8px;
    padding: 12px;
    border: 1px solid var(--notes-line);
    border-radius: 8px;
    background: var(--notes-field);
    color: var(--notes-ink);
  }

  .panel-handle { display: none; }

  /* Three columns from 1000px, filling the window, as the sticky notes sit now:
     Month full height on the left, Today above Tomorrow in the middle, Migrate
     above Quick notes on the right. */
  @media (min-width: 1000px) {
    #app { height: calc(100dvh - var(--notes-header-height)); }
    .panels {
      height: 100%;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-areas: "month today migrate" "month tomorrow quick";
    }
    /* Month's width once it has been dragged or set from the keyboard. The other
       two columns share what is left equally. */
    .panels[data-month-width] { grid-template-columns: var(--month-width) minmax(0, 1fr) minmax(0, 1fr); }
    .panel-handle { display: block; position: absolute; top: 12px; bottom: 12px; z-index: 5; width: 12px; transform: translateX(-50%); cursor: col-resize; touch-action: none; }
    .panel-handle::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; transform: translateX(-50%); background: var(--notes-line); }
    .panel-handle:hover::before { width: 2px; background: var(--notes-icon); }
    .panel-handle[data-dragging="true"]::before { width: 2px; background: var(--notes-accent); }
    .panel-handle:focus-visible { outline: 2px solid var(--notes-strong); outline-offset: 2px; }
  }
  @media (min-width: 1000px) and (pointer: coarse) {
    .panel-handle { width: 44px; }
  }
  html[data-resizing="true"], html[data-resizing="true"] * { cursor: col-resize !important; user-select: none; }

  /* Small window and iPad portrait: Month stays on the left, as tall as the
     window, and the other four stack on the right and the page scrolls. */
  @media (min-width: 761px) and (max-width: 999px) {
    .panels {
      align-items: start;
      grid-template-columns: minmax(260px, 0.8fr) minmax(0, 1.2fr);
      grid-template-areas: "month today" "month tomorrow" "month migrate" "month quick";
    }
    #panel-month {
      position: sticky;
      top: calc(var(--notes-header-height) + 12px);
      height: calc(100dvh - var(--notes-header-height) - 24px);
    }
    #panel-today, #panel-tomorrow, #panel-migrate, #panel-quick { min-height: 220px; }
    #panel-today .panel-body, #panel-tomorrow .panel-body, #panel-migrate .panel-body { flex: none; overflow: visible; }
  }

  /* Phone: one panel at a time, five tabs along the bottom. */
  @media (max-width: 760px) {
    #app { padding-bottom: calc(56px + env(safe-area-inset-bottom)); }
    .panels { display: block; padding: 8px; }
    .panel { display: none; height: calc(100dvh - var(--notes-header-height) - 56px - env(safe-area-inset-bottom) - 16px); }
    .panel[data-active="true"] { display: flex; }
    .tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      display: flex;
      gap: 4px;
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--notes-line);
      background: var(--notes-panel);
    }
    .tabbar button { flex: 1; min-height: 44px; padding: 0 4px; }
    .tabbar button[aria-selected="true"] {
      border: 1px solid var(--notes-line);
      background: var(--notes-selected);
      color: var(--notes-strong);
    }
    .flash { top: calc(var(--notes-header-height) + 4px); }
  }
  .tabbar { display: none; }
  @media (max-width: 760px) {
    .tabbar { display: flex; }
    .mark { display: none; }
    .bar-inner { padding: 0 8px; }
    .bar-right { gap: 2px; }
    #sign-out, #notes-link, #done-open { padding: 0 8px; }
    .done-view { margin: 8px; }
    .done-row { flex-wrap: wrap; }
    .done-log { flex: 1 0 100%; padding: 0 8px 6px 40px; }
  }

  /* ---------- the add bar ---------- */

  .addbar { padding: 8px 12px 12px; border-top: 1px solid var(--notes-line-soft); background: var(--notes-panel); }
  .editor-line, .quick-editor {
    display: block;
    width: 100%;
    min-height: 36px;
    padding: 6px 12px;
    border: 1px solid var(--notes-line);
    border-radius: 8px;
    background: var(--notes-field);
    color: var(--notes-ink);
    overflow-wrap: anywhere;
  }
  .editor-line:empty::before, .quick-editor:empty::before {
    content: attr(data-placeholder);
    color: var(--notes-muted);
    pointer-events: none;
  }
  .addtools { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
  .addtools .grow { flex: 1; }
  .type-button, .fmt-button { width: 36px; padding: 0; border: 1px solid var(--notes-line); border-radius: 6px; }
  .type-button { color: var(--notes-icon); }
  .type-button[aria-pressed="true"] { background: var(--notes-selected); color: var(--notes-strong); }
  .fmt-button { color: var(--notes-ink); font-size: var(--notes-size-15); }
  .fmt-button[aria-pressed="true"] { background: var(--notes-selected); color: var(--notes-strong); }
  .fmt-button .struck { text-decoration: line-through; }
  @media (pointer: coarse) {
    .editor-line, .quick-editor { min-height: 44px; padding: 10px 12px; }
    .type-button, .fmt-button { width: 44px; }
  }

  /* ---------- entries ---------- */

  .entries { list-style: none; margin: 0; padding: 0 4px; }
  .entry { position: relative; border-radius: 8px; }
  .entry:hover { background: var(--notes-hover); }
  .entry-main { display: flex; align-items: flex-start; gap: 4px; min-height: 36px; padding-right: 4px; }
  .bullet {
    flex: none;
    width: 32px;
    height: 36px;
    min-height: 0;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: var(--notes-icon);
  }
  span.bullet { display: flex; align-items: center; justify-content: center; }
  button.bullet:hover { border-color: var(--notes-line); background: transparent; }
  .entry-text {
    flex: 1;
    min-width: 0;
    padding: 6px 4px;
    color: var(--notes-ink);
    overflow-wrap: anywhere;
    border-radius: 6px;
  }
  .entry-tail { display: flex; flex: none; align-items: center; gap: 4px; min-height: 36px; }
  .entry-note { font-size: var(--notes-size-12); color: var(--notes-muted); white-space: nowrap; }
  .entry[data-state="done"] .entry-text,
  .entry[data-state="dropped"] .entry-text { color: var(--notes-muted); text-decoration: line-through; }
  .entry[data-state="done"] .bullet,
  .entry[data-state="dropped"] .bullet,
  .entry[data-state="migrated"] .bullet,
  .entry[data-state="scheduled"] .bullet { color: var(--notes-muted); }
  .entry[data-state="migrated"] .entry-text,
  .entry[data-state="scheduled"] .entry-text { color: var(--notes-muted); }
  .entry.orphan { border: 1px solid var(--notes-line); }
  @media (pointer: coarse) {
    .entry-main { min-height: 44px; }
    .bullet { width: 44px; height: 44px; }
    .entry-text { padding: 10px 4px; }
    .entry-tail { min-height: 44px; }
    .date-row { min-height: 44px; }
    .line-text { min-height: 44px; padding: 10px 4px; }
  }

  /* The four moves. On a line of their own under the text, opened by the More
     button for a finger, and shown by keyboard focus for a mouse. They are never
     laid over the text, at any width. */
  .entry-actions { display: none; flex-wrap: wrap; gap: 4px; padding: 0 4px 8px 36px; }
  .entry-actions button { flex: 1 1 96px; min-height: 36px; }
  .entry[data-open="true"] .entry-actions { display: flex; }
  .entry[data-picking="true"] .entry-actions { display: none; }
  .more { color: var(--notes-icon); }
  .entry-delete { color: var(--notes-icon); }
  .entry-delete:hover, .entry-delete:focus-visible { color: var(--notes-bad); }
  .date-pick { display: none; margin: 0 4px 8px 36px; padding: 8px; border: 1px solid var(--notes-line); border-radius: 8px; background: var(--notes-field); }
  .entry[data-picking="true"] .date-pick { display: block; }
  .pick-head { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .pick-title { font-size: var(--notes-size-14); font-weight: 700; color: var(--notes-strong); }
  .pick-list { max-height: 264px; overflow-y: auto; margin-top: 4px; }

  /* A mouse drags an entry onto a panel or a date, so the moves are not offered on
     hover and there is no More button. They are offered on keyboard focus, so every

  /* ---------- Peels (CLAUDE.md 9e) ----------
     Today, Tomorrow and Migrate are sticky note paper, from Spud Notes' own
     colours, the same in both themes with dark text on them. Inside a Peel the
     page's own variables are pointed at the Peel's, so every rule above reads the
     Peel's colour and nothing else needs to know. Month and Quick notes are not

  .panel[data-peel] {

    --notes-selected: var(--notes-peel-green-selected);
    --notes-field: var(--notes-peel-green-field);
    --notes-ground: var(--notes-peel-green-field);
    --notes-line: var(--notes-peel-green-line);

  /* A span is one entry. Its words are on the first day, followed by where it ends,

  .span-gutter { flex: none; width: calc(var(--lanes, 0) * 14px); }
  .span-bar { position: absolute; top: 0; bottom: 0; left: calc(72px + var(--lane, 0) * 14px); width: 14px; cursor: pointer; }

  .span-range { flex: none; margin-left: 4px; font-size: var(--notes-size-13); color: var(--notes-muted); white-space: nowrap; }

  .span-until { display: none; flex: none; min-height: 44px; padding: 0 8px; gap: 4px; font-size: var(--notes-size-13); }

  .until-menu button:hover { background: var(--notes-hover); }
  .until-menu button[aria-checked="true"] { background: var(--notes-selected); color: var(--notes-strong); }
  .until-menu .pick-head { padding: 0 0 4px; }
  .until-menu .pick-list { max-height: 264px; }

  /* ---------- Quick notes ---------- */

  .quick-tools { display: flex; align-items: center; gap: 4px; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: var(--notes-size-12); color: var(--notes-muted); }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 6px; background: var(--notes-muted); }

  .done-head .panel-title:focus-visible { outline: 2px solid var(--notes-accent); outline-offset: 2px; }
  .done-nav { display: flex; align-items: center; gap: 2px; }
  .done-month { min-width: 9em; text-align: center; font-size: var(--notes-size-18); font-weight: 700; color: var(--notes-strong); }
  .done-body { max-width: 720px; padding: 8px 8px 24px; }
  .done-day { margin: 16px 8px 4px; font-size: var(--notes-size-14); font-weight: 700; color: var(--notes-strong); }
  .done-list { list-style: none; margin: 0; padding: 0 4px; }
  .done-row { display: flex; align-items: flex-start; gap: 4px; min-height: 36px; }
  .done-row .bullet { color: var(--notes-muted); }
  .done-text { flex: 1; min-width: 0; padding: 6px 4px; color: var(--notes-ink); overflow-wrap: anywhere; }
  .done-log { flex: none; padding: 8px 8px 0 0; font-size: var(--notes-size-12); color: var(--notes-muted); white-space: nowrap; }
  @media (pointer: coarse) {
    .done-row { min-height: 44px; }
    .done-text { padding: 10px 4px; }
  }

  /* ---------- searching the calendar ---------- */

  .month-search { padding: 8px 12px 0; }
  .search-field {
    appearance: none;
    display: block;
    width: 100%;
    min-height: 36px;
    padding: 6px 12px;
    border: 1px solid var(--notes-line);
    border-radius: 8px;
    background: var(--notes-field);
    color: var(--notes-ink);
    font: inherit;
    font-size: var(--notes-size-14);
  }

  @media (pointer: coarse) {
    .search-field { min-height: 44px; }
    .search-result { min-height: 44px; }
  }
</style>

<script id="theme-switch-script">
(function () {
  "use strict";

  var KEY = "silurian-notes-theme";
  var root = document.documentElement;
  var button = document.getElementById("theme-switch");
  var query = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

  function current() {
    var chosen = root.getAttribute("data-theme");
    if (chosen === "light" || chosen === "dark") { return chosen; }
    return query && query.matches ? "dark" : "light";
  }

  // The window's title bar takes the page colour, so the installed app reads as
  // one surface. With no choice made the two tags above carry the light and dark
  // pair and the device picks. After a choice both take the page's own colour,
  // read from its variable so it is never written a second time here.
  var bars = Array.prototype.slice.call(document.querySelectorAll('meta[name="theme-color"]'));
  var pair = bars.map(function (tag) { return tag.getAttribute("content"); });

  function paintBar() {
    var chosen = root.getAttribute("data-theme");
    var ground = getComputedStyle(root).getPropertyValue("--notes-ground").trim();
    bars.forEach(function (tag, index) {
      tag.setAttribute("content", chosen === "light" || chosen === "dark" ? ground : pair[index]);
    });
  }

  function paint() {
    button.setAttribute("aria-label", current() === "dark" ? "Switch to light mode" : "Switch to dark mode");
    paintBar();
  }

  function flip() {
    var next = current() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    // The choice is remembered on this device only. If storage is blocked the
    // switch still works for this visit.
    try { localStorage.setItem(KEY, next); } catch (e) { /* not saved */ }
    paint();
  }

  button.addEventListener("click", flip);
  if (query && query.addEventListener) { query.addEventListener("change", paint); }
  paint();
})();
</script>

<script id="month-handle-script">
(function () {
  "use strict";

  // Month's width at 1000px and up. Held on this device only, like the theme,
  // and never sent anywhere. A width that no longer fits the window is trimmed on
  // the screen and left as it was in storage, so a wider window brings it back.
  var HANDLE_KEY = "silurian-journal-month-width";
  var MIN = 240;
  var STEP = 16;
  var BIG_STEP = 64;
  var PAD = 12;
  var GAP = 12;
  var OTHER_MIN = 280;
  var root = document.documentElement;
  var wide = window.matchMedia("(min-width: 1000px)");
  var panels = document.getElementById("panels");
  var month = document.getElementById("panel-month");
  var handle = document.getElementById("month-handle");
  var width = null;
  var dragging = false;
  var grab = 0;

  try {
    var raw = localStorage.getItem(HANDLE_KEY);
    var saved = parseInt(raw, 10);
    if (saved > 0 && String(saved) === raw) { width = saved; }
  } catch (e) { /* storage is blocked: Month keeps its default width */ }

  function limits() {
    var available = panels.clientWidth - 2 * PAD - 2 * GAP;
    return { min: MIN, max: Math.max(MIN, Math.min(Math.floor(available / 2), available - 2 * OTHER_MIN)) };
  }

  function clamp(value) {
    var l = limits();
    return Math.min(l.max, Math.max(l.min, value));
  }

  function place() {
    if (!wide.matches || !panels.clientWidth) { return; }
    if (width === null) {
      panels.removeAttribute("data-month-width");
      panels.style.removeProperty("--month-width");
    } else {
      panels.setAttribute("data-month-width", "set");
      panels.style.setProperty("--month-width", clamp(width) + "px");
    }
    var l = limits();
    var box = month.getBoundingClientRect();
    var frame = panels.getBoundingClientRect();
    handle.style.left = (box.right - frame.left + GAP / 2) + "px";
    handle.setAttribute("aria-valuemin", String(l.min));
    handle.setAttribute("aria-valuemax", String(l.max));
    handle.setAttribute("aria-valuenow", String(Math.round(box.width)));
  }

  function keep() {
    try {
      if (width === null) { localStorage.removeItem(HANDLE_KEY); } else { localStorage.setItem(HANDLE_KEY, String(width)); }
    } catch (e) { /* not saved */ }
  }

  function setWidth(value, save) {
    width = clamp(Math.round(value));
    place();
    if (save) { keep(); }
  }

  function reset() {
    width = null;
    place();
    keep();
  }

  function stop() {
    if (!dragging) { return; }
    dragging = false;
    handle.removeAttribute("data-dragging");
    root.removeAttribute("data-resizing");
    keep();
  }

  handle.addEventListener("pointerdown", function (event) {
    if (event.pointerType === "mouse" && event.button !== 0) { return; }
    event.preventDefault();
    var box = handle.getBoundingClientRect();
    grab = event.clientX - (box.left + box.width / 2);
    dragging = true;
    handle.setAttribute("data-dragging", "true");
    root.setAttribute("data-resizing", "true");
    try { handle.setPointerCapture(event.pointerId); } catch (e) { /* the move events still arrive */ }
    handle.focus();
  });
  handle.addEventListener("pointermove", function (event) {
    if (!dragging) { return; }
    var frame = panels.getBoundingClientRect();
    setWidth(event.clientX - grab - frame.left - PAD - GAP / 2, false);
  });
  handle.addEventListener("pointerup", stop);
  handle.addEventListener("pointercancel", stop);
  handle.addEventListener("lostpointercapture", stop);
  handle.addEventListener("dblclick", reset);
  handle.addEventListener("keydown", function (event) {
    var step = event.shiftKey ? BIG_STEP : STEP;
    var now = Math.round(month.getBoundingClientRect().width);
    if (event.key === "ArrowLeft") { setWidth(now - step, true); }
    else if (event.key === "ArrowRight") { setWidth(now + step, true); }
    else if (event.key === "Home") { setWidth(limits().min, true); }
    else if (event.key === "End") { setWidth(limits().max, true); }
    else if (event.key === "Enter") { reset(); }
    else { return; }
    event.preventDefault();
  });

  if (typeof ResizeObserver === "function") { new ResizeObserver(place).observe(panels); }
  window.addEventListener("resize", place);
  if (wide.addEventListener) { wide.addEventListener("change", place); }
  place();
})();
</script>

<script type="module">
import * as core from "/journal/core.js";

(function () {
  "use strict";

  var TAB_KEY = "silurian-journal-tab";
  // Quick notes: one burst of typing is one save (a five second pause, thirty seconds
  // at most from the first unsaved key). Leaving the box or hiding the window saves at once.
  var SAVE_DELAY_MS = 5000;
  var SAVE_MAX_WAIT_MS = 30000;
  // The journal never asks the server on a timer. It asks again when the window is
  // brought back (shown, or focused), and then only if five minutes have passed since
  // it last asked, or the date has changed. A window that is hidden never asks.
  var REFRESH_MIN_MS = 5 * 60 * 1000;
  var UNDO_MS = 10000;
  var NOT_CHANGED = "Could not save that change. Nothing was changed. Try again.";
  var NOT_LOADED = "Could not load your journal. Check your connection and reload.";
  var PANELS = ["month", "today", "tomorrow", "migrate", "quick"];

  function $(id) { return document.getElementById(id); }

  /* ---------- small helpers ---------- */

  function make(tag, className, text) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    if (text !== undefined) { node.textContent = text; }
    return node;
  }

  function icon(name, extra) {
    var holder = document.createElement("span");
    holder.innerHTML = '<svg class="icon' + (extra ? " " + extra : "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false"><use href="#' + name + '"></use></svg>';
    return holder.firstChild;
  }

  function newId() {
    var bytes = new Uint8Array(16);
    crypto.getRandomValues(bytes);
    return Array.prototype.map.call(bytes, function (b) { return (b < 16 ? "0" : "") + b.toString(16); }).join("");
  }

  // The date in London, which is the owner's day whatever the device's zone is.
  function londonDate() {
    var parts = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/London", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date());
    var got = {};
    parts.forEach(function (p) { got[p.type] = p.value; });
    return got.year + "-" + got.month + "-" + got.day;
  }

  function utc(date) {
    var p = date.split("-");
    return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
  }
  var fmtLong = new Intl.DateTimeFormat("en-GB", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" });
  var fmtShort = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", timeZone: "UTC" });
  var fmtWeekday = new Intl.DateTimeFormat("en-GB", { weekday: "short", timeZone: "UTC" });
  var fmtMonthYear = new Intl.DateTimeFormat("en-GB", { month: "long", year: "numeric", timeZone: "UTC" });
  var fmtMonth = new Intl.DateTimeFormat("en-GB", { month: "long", timeZone: "UTC" });
  var fmtMonthShort = new Intl.DateTimeFormat("en-GB", { month: "short", timeZone: "UTC" });
  function longDate(date) { return fmtLong.format(utc(date)); }
  function shortDate(date) { return fmtShort.format(utc(date)); }
  function monthYear(month) { return fmtMonthYear.format(utc(month + "-01")); }
  function monthName(month) { return fmtMonth.format(utc(month + "-01")); }

  /* ---------- state ---------- */

  var today = londonDate();
  function tomorrow() { return core.addDays(today, 1); }
  function thisMonth() { return core.monthOf(today); }

  var confirmed = {};      // month -> the file as the server last said it is
  var pending = [];        // changes shown at once and not yet confirmed
  var shown = {};          // confirmed with the pending changes applied: what is on screen
  var spansConfirmed = {}; // span id -> the span as the server last said it is
  var spansShown = {};     // those with the pending span changes applied: what is on screen
  var selectedSpan = null; // the id of the span whose bar was clicked
  var spanDrag = null;     // the handle drag in progress
  var sending = false;
  var generation = 0;      // bumped when the page empties, so a late answer is ignored
  var signedIn = false;
  var viewMonth = thisMonth();
  var dayView = null;      // a date opened in the Month panel, or null
  var pickerOpen = false;
  var pickerYear = null;
  var ui = { openMove: null, picking: null, movedOpen: {} };   // openMove and picking are { list, id }; movedOpen is by list
  var quick = { text: "", base: "none", dirty: false, saving: false, timer: null, failed: false, promise: null };
  var stripMonths = [];    // the months the last load sent: the strip looks only there
  var lastRefresh = 0;
  var search = { q: "", loaded: false, loading: false, at: 0 };   // the calendar search
  var done = { open: false, month: null, state: "idle", items: [], cache: {}, pushed: false, ask: 0 };   // the Done list
  var flashTimer = null;
  var flashRun = null;
  var flashAlso = null;   // the second button of the message bar, or null

  function stripFiles() {
    var files = {};
    stripMonths.forEach(function (m) { if (shown[m]) { files[m] = shown[m]; } });
    return files;
  }

  function recompute() {
    shown = {};
    Object.keys(confirmed).forEach(function (m) { shown[m] = core.cloneMonth(confirmed[m]); });
    spansShown = core.cloneSpans(spansConfirmed);
    pending.forEach(function (item) {
      if (core.isSpanOp(item.op)) { core.applySpanOp(spansShown, item.op); }
      else { core.applyOp(shown, item.op); }
    });
  }

  // Spans from the server are put together with the page's: the higher revision
  // of each wins, and a removal arrives as a revision, not as an absence.
  function takeSpans(list) {
    if (!Array.isArray(list)) { return; }
    var incoming = {};
    list.forEach(function (span) { incoming[span.id] = span; });
    spansConfirmed = core.mergeSpans(spansConfirmed, incoming);
  }

  // What the server says is put together with what this device holds, entry by
  // entry: the higher revision of each entry and each line wins, and nothing is
  // dropped because a read lacks it. A read can be shorter or older than a save
  // this device has made, and it never draws over it. A removal arrives as a
  // revision, not as an absence.
  function takeMonths(months) {
    Object.keys(months || {}).forEach(function (m) {
      confirmed[m] = core.mergeMonth(confirmed[m], months[m]);
    });
  }

  /* ---------- talking to the server ---------- */

  function request(path, options) {
    options = options || {};
    options.credentials = "same-origin";
    return fetch(path, options).then(function (response) {
      if (response.status === 401 && path !== "/api/login") { goToLogin(); }
      return response;
    });
  }

  function readJson(response) {
    return response.json().catch(function () { return {}; });
  }

  function loadMonths(months) {
    var need = months.filter(function (m) { return !confirmed[m]; });
    if (need.length === 0) { return Promise.resolve(true); }
    var gen = generation;
    return request("/api/journal?view=months&months=" + need.join(",")).then(function (response) {
      if (!response.ok) { throw new Error("load"); }
      return readJson(response);
    }).then(function (body) {
      if (gen !== generation) { return false; }
      takeMonths(body.months);
      takeSpans(body.spans);
      recompute();
      return true;
    }).catch(function () {
      showFlash("Could not load that month. Check your connection and try again.", null);
      return false;
    });
  }

  // Shows a change at once, then sends it. The same rules the server applies are
  // applied here to the page's copy, so what is shown is what the server will
  // say. Changes go one at a time, in order. If one is refused, the changes
  // behind it are dropped with it and the page goes back to what the server last
  // confirmed, with the message.
  function submit(op, hooks) {
    hooks = hooks || {};
    // The time an entry is made, which sets where it sits in its list. The page
    // says it, as it says the date, and the same change sent again says the same.
    if ((op.op === "add" || op.op === "move") && op.at === undefined) { op.at = Date.now(); }
    if (core.isSpanOp(op)) {
      // A span is not in any month. The same rules are applied to the page's copy.
      var spanTrial = core.cloneSpans(spansShown);
      var spanResult = core.applySpanOp(spanTrial, op);
      if (spanResult.error) {
        refused("stale", [{ hooks: hooks }]);
        return Promise.resolve(false);
      }
      pending.push({ op: op, hooks: hooks });
      recompute();
      renderAll();
      pump();
      return Promise.resolve(true);
    }
    return loadMonths(core.monthsFor(op)).then(function (ok) {
      if (!ok) { if (hooks.onFail) { hooks.onFail("error"); } return false; }
      var trial = {};
      core.monthsFor(op).forEach(function (m) { trial[m] = core.cloneMonth(shown[m]); });
      var result = core.applyOp(trial, op);
      if (result.error) {
        refused(result.error.code === "undo" ? "undo" : "stale", [{ hooks: hooks }]);
        return false;
      }
      pending.push({ op: op, hooks: hooks });
      recompute();
      renderAll();
      pump();
      return true;
    });
  }

  var RETRY_MS = [1500, 3000, 5000];

  function pause(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  // One request for the change, tried again, as the very same change, if it could
  // not be sent or the server could not finish it. The server treats a repeat of a
  // change that already happened as done, so a retry never makes a second copy.
  function sendChange(item, gen, tries) {
    var body = JSON.stringify(item.op);
    return request("/api/journal", { method: "POST", headers: { "Content-Type": "application/json" }, body: body }).then(function (response) {
      return readJson(response).then(function (answer) { return { status: response.status, body: answer }; });
    }).catch(function () {
      return { status: 0, body: {} };
    }).then(function (answer) {
      var again = (answer.status === 0 || answer.status >= 500) && tries < RETRY_MS.length && gen === generation;
      if (!again) { return answer; }
      return pause(RETRY_MS[tries]).then(function () { return gen === generation ? sendChange(item, gen, tries + 1) : answer; });
    });
  }

  function pump() {
    if (sending || pending.length === 0 || !signedIn) { return; }
    sending = true;
    var item = pending[0];
    var gen = generation;
    sendChange(item, gen, 0).then(function (answer) {
      if (gen !== generation) { return; }
      sending = false;
      if (answer.status === 200) {
        takeMonths(answer.body.months);
        takeSpans(answer.body.spans);
        done.cache = {};
        pending.shift();
        recompute();
        renderAll();
        if (item.hooks.onSaved) { item.hooks.onSaved(); }
        pump();
        return;
      }
      if (answer.status === 401) { return; }
      refused(answer.status === 409 ? (answer.body.code === "undo" ? "undo" : "stale") : "error", pending.splice(0, pending.length));
    });

  // A change was refused or could not be sent. Nothing was saved. The screen goes
  // back to what the server last confirmed, and anything typed is given back.
  function refused(kind, dropped) {
    pending.length = 0;
    recompute();
    renderAll();
    dropped.forEach(function (item) { if (item.hooks && item.hooks.onFail) { item.hooks.onFail(kind); } });
    if (kind === "stale") {
      showFlash(core.MESSAGES.stale, { label: "Reload", run: function () { return refresh(true).then(function () { return true; }); } });
    } else if (kind === "undo") {
      showFlash(core.MESSAGES.undo, null);
    } else {
      showFlash(NOT_CHANGED, null);
    }
  }

  function drained() {
    return new Promise(function (resolve) {
      (function wait() {
        if (pending.length === 0 && !sending) { resolve(true); return; }
        setTimeout(wait, 40);
      })();
    });
  }

  /* ---------- the message bar ---------- */

  function showFlash(text, action, autoHide, also) {
    clearTimeout(flashTimer);
    $("flash-text").textContent = text;
    flashRun = action ? action.run : null;
    flashAlso = also ? also.run : null;
    var button = $("flash-action");
    button.hidden = !action;
    button.textContent = action ? action.label : "";
    button.disabled = false;
    var second = $("flash-also");
    second.hidden = !also;
    second.textContent = also ? also.label : "";
    $("flash").hidden = false;
    if (autoHide) { flashTimer = setTimeout(hideFlash, UNDO_MS); }
  }

  function hideFlash() {
    clearTimeout(flashTimer);
    $("flash").hidden = true;
    flashRun = null;
    flashAlso = null;
  }

  $("flash-close").addEventListener("click", hideFlash);
  $("flash-also").addEventListener("click", function () {
    var run = flashAlso;
    hideFlash();
    if (run) { run(); }
  });
  $("flash-action").addEventListener("click", function () {
    var run = flashRun;
    if (!run) { return; }
    $("flash-action").disabled = true;
    Promise.resolve(run()).then(function (ok) {
      $("flash-action").disabled = false;
      if (ok) { hideFlash(); }
    });
  });

  // A message with an Undo that lasts ten seconds. The Undo is a list of changes
  // sent in order, each as an ordinary change with its own version check.
  function offerUndo(text, ops, also) {
    showFlash(text, { label: "Undo", run: function () { return runUndo(ops); } }, true, also);
  }

  function runUndo(ops) {
    var chain = Promise.resolve(true);
    ops.forEach(function (op) { chain = chain.then(function (ok) { return ok ? submit(op, {}) : false; }); });
    return chain.then(function (ok) { return ok; });
  }

  /* ---------- text and editors ---------- */

  // Bold and strike-through markers in stored text, drawn as styled text.
  function drawMarks(into, text, multiline) {
    into.textContent = "";
    if (String(text) === "") { return; }
    var lines = multiline ? String(text).split("\n") : [String(text)];
    lines.forEach(function (line, index) {
      var target = into;
      if (multiline) { target = make("div"); into.appendChild(target); }
      var pieces = core.parseMarks(line);
      if (pieces.length === 0 && multiline) { target.appendChild(document.createElement("br")); }
      pieces.forEach(function (piece) {
        var node = document.createTextNode(piece.text);
        if (piece.strike) { var s = document.createElement("s"); s.appendChild(node); node = s; }
        if (piece.bold) { var b = document.createElement("b"); b.appendChild(node); node = b; }
        target.appendChild(node);
      });
      void index;
    });
  }

  // The stored text for what is in an editor: bold and strike-through as markers.
  function readEditor(editor) {
    var out = [];
    function walk(node, bold, strike) {
      node.childNodes.forEach(function (child) {
        if (child.nodeType === 3) { out.push(child.nodeValue.replace(/\xa0/g, " ")); return; }
        if (child.nodeType !== 1) { return; }
        var name = child.nodeName;
        if (name === "BR") { out.push("\n"); return; }
        var style = child.style || {};
        var isBold = name === "B" || name === "STRONG" || style.fontWeight === "bold" || Number(style.fontWeight) >= 600;
        var isStrike = name === "S" || name === "STRIKE" || name === "DEL" || String(style.textDecoration + style.textDecorationLine).indexOf("line-through") !== -1;
        var block = name === "DIV" || name === "P";
        if (block && out.length > 0 && out[out.length - 1] !== "\n") { out.push("\n"); }
        if (isBold && !bold) { out.push("**"); }
        if (isStrike && !strike) { out.push("~~"); }
        walk(child, bold || isBold, strike || isStrike);
        if (isStrike && !strike) { out.push("~~"); }
        if (isBold && !bold) { out.push("**"); }
      });
    }
    walk(editor, false, false);
    var text = out.join("");
    // Empty markers left by deleting styled text.
    text = text.replace(/\*\*\*\*|~~~~/g, "");
    return editor.getAttribute("data-editor") === "multi" ? text.replace(/\n+$/, "") : text.replace(/\s*\n+\s*/g, " ");
  }

  // Keeps the empty look (the placeholder) when everything has been deleted.
  function tidy(editor) {
    if (editor.textContent === "" && editor.childNodes.length > 0) { editor.textContent = ""; }
  }

  var activeEditor = null;
  document.addEventListener("focusin", function (event) {
    var target = event.target;
    if (target && target.matches && target.matches("[data-editor]")) { activeEditor = target; }
  });

  function format(command, panelEditor) {
    var focused = document.activeElement && document.activeElement.matches && document.activeElement.matches("[data-editor]") ? document.activeElement : null;
    var editor = focused || panelEditor;
    if (!editor) { return; }
    if (editor !== focused) { editor.focus(); }
    try { document.execCommand("styleWithCSS", false, false); } catch (e) { /* older browsers */ }
    document.execCommand(command, false, null);
    syncFormatButtons();
  }

  function syncFormatButtons() {
    var bold = false;
    var strike = false;
    var focused = document.activeElement && document.activeElement.matches && document.activeElement.matches("[data-editor]");
    if (focused) {
      try { bold = document.queryCommandState("bold"); strike = document.queryCommandState("strikeThrough"); } catch (e) { /* not available */ }
    }
    Array.prototype.forEach.call(document.querySelectorAll(".fmt-bold"), function (b) { b.setAttribute("aria-pressed", bold ? "true" : "false"); });
    Array.prototype.forEach.call(document.querySelectorAll(".fmt-strike"), function (b) { b.setAttribute("aria-pressed", strike ? "true" : "false"); });
  }
  document.addEventListener("selectionchange", syncFormatButtons);

  // Plain text only comes in: no pasted styles, links or lists.
  function wireEditor(editor) {
    var single = editor.getAttribute("data-editor") === "single";
    editor.addEventListener("paste", function (event) {
      event.preventDefault();
      var text = (event.clipboardData || window.clipboardData).getData("text/plain");
      if (single) { text = text.replace(/\s*[\r\n]+\s*/g, " "); }
      document.execCommand("insertText", false, text);
    });
    editor.addEventListener("drop", function (event) { event.preventDefault(); });
    editor.addEventListener("beforeinput", function (event) {
      var type = event.inputType || "";
      if (type === "formatItalic" || type === "formatUnderline") { event.preventDefault(); }
      if (single && (type === "insertParagraph" || type === "insertLineBreak")) { event.preventDefault(); }
    });
    editor.addEventListener("keydown", function (event) {
      var key = (event.key || "").toLowerCase();
      var mod = event.ctrlKey || event.metaKey;
      if (mod && !event.shiftKey && !event.altKey && key === "b") { event.preventDefault(); format("bold", editor); }
      else if (mod && event.shiftKey && !event.altKey && key === "x") { event.preventDefault(); format("strikeThrough", editor); }
      else if (mod && (key === "i" || key === "u")) { event.preventDefault(); }
    });

  }

  /* ---------- bullets in Quick notes ----------
     The rules are core.js's (typing "- " or "* ", Enter, the button). This only
     carries them out on what is on screen, through the editing commands so Undo
     still works. A line is whatever sits between line breaks, so the first line,
     which the browser keeps as bare text, and the lines after it, which it keeps
     as divs, are read the same way. */

  var NBSP = / /g;

  function editorLines(editor) {
    var lines = [];
    var run = null;
    Array.prototype.forEach.call(editor.childNodes, function (node) {
      if (node.nodeName === "DIV") { run = null; lines.push([node]); }
      else if (node.nodeName === "BR") { if (run) { run = null; } else { lines.push([node]); } }
      else { if (!run) { run = []; lines.push(run); } run.push(node); }
    });
    return lines;
  }

  function lineText(line) {
    return line.map(function (n) { return n.textContent; }).join("").replace(NBSP, " ");
  }

  function firstText(line) {
    for (var i = 0; i < line.length; i += 1) {
      if (line[i].nodeType === 3) { return line[i]; }
      var node = document.createTreeWalker(line[i], NodeFilter.SHOW_TEXT).nextNode();
      if (node) { return node; }
    }
    return null;
  }

  // The line the caret is in: { lines, index, line, sel } or null.
  function caretLine(editor) {
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || !editor.contains(sel.anchorNode)) { return null; }
    var lines = editorLines(editor);
    var node = sel.anchorNode;
    if (node === editor) { node = editor.childNodes[Math.min(sel.anchorOffset, editor.childNodes.length - 1)] || null; }
    for (var i = 0; i < lines.length && node; i += 1) {
      for (var j = 0; j < lines[i].length; j += 1) {
        if (lines[i][j] === node || lines[i][j].contains(node)) { return { lines: lines, index: i, line: lines[i], sel: sel }; }
      }
    }
    return null;
  }

  // How many characters of the line are before the caret.
  function caretOffset(at) {
    var range = document.createRange();
    range.setStartBefore(at.line[0]);
    range.setEnd(at.sel.anchorNode, at.sel.anchorOffset);
    return range.toString().replace(NBSP, " ").length;
  }

  // The caret put back at a character offset in a line.
  function putCaret(editor, index, offset) {
    var line = editorLines(editor)[index];
    var sel = window.getSelection();
    if (!line) { return; }
    var left = offset;
    var range = document.createRange();
    var placed = false;
    line.forEach(function (n) {
      var texts = [];
      if (n.nodeType === 3) { texts.push(n); }
      else { var walker = document.createTreeWalker(n, NodeFilter.SHOW_TEXT); var t = walker.nextNode(); while (t) { texts.push(t); t = walker.nextNode(); } }
      texts.forEach(function (t) {
        if (placed) { return; }
        if (left <= t.nodeValue.length) { range.setStart(t, left); placed = true; } else { left -= t.nodeValue.length; }
      });
    });
    if (!placed) { range.selectNodeContents(line[line.length - 1]); range.collapse(false); }
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function selectText(node, from, to) {
    var range = document.createRange();
    range.setStart(node, from);
    range.setEnd(node, to);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function wireBullets(editor) {
    // "- " or "* " typed at the start of a line becomes a bullet.
    editor.addEventListener("input", function (event) {
      if (event.inputType !== "insertText" || (event.data !== " " && event.data !== " ")) { return; }
      var at = caretLine(editor);
      if (!at || core.bulletFromTyping(lineText(at.line)) === null || caretOffset(at) !== 2) { return; }
      var first = firstText(at.line);
      if (!first) { return; }
      selectText(first, 0, 1);
      document.execCommand("insertText", false, core.BULLET);
      putCaret(editor, at.index, 2);
    });
    editor.addEventListener("keydown", function (event) {
      if (event.key !== "Enter" || event.shiftKey || event.ctrlKey || event.metaKey || event.altKey || event.isComposing) { return; }
      var at = caretLine(editor);
      if (!at || !at.sel.isCollapsed) { return; }
      var action = core.afterEnter(lineText(at.line));
      if (action === "plain") { return; }
      if (action === "continue" && caretOffset(at) < 2) { return; }
      event.preventDefault();
      if (action === "end") {
        var first = firstText(at.line);
        if (first) { selectText(first, 0, first.nodeValue.length); document.execCommand("delete"); }
        return;
      }
      document.execCommand("insertParagraph");
      document.execCommand("insertText", false, core.BULLET + " ");
    });
  }

  // The button: the line the caret is in becomes a bullet, or goes back to plain text.
  function toggleBulletLine(editor) {
    if (document.activeElement !== editor) { editor.focus(); }
    var at = caretLine(editor);
    if (!at) {
      var end = document.createRange();
      end.selectNodeContents(editor);
      end.collapse(false);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(end);
      document.execCommand("insertText", false, core.BULLET + " ");
      syncBulletButton();
      return;
    }
    var text = lineText(at.line);
    var offset = caretOffset(at);
    var first = firstText(at.line);
    if (core.isBulletLine(text)) {
      var marker = first && first.nodeValue.length > 1 && first.nodeValue.charAt(1).trim() === "" ? 2 : 1;
      if (first) { selectText(first, 0, marker); document.execCommand("delete"); }
      putCaret(editor, at.index, Math.max(0, offset - marker));
    } else {
      if (first) { selectText(first, 0, 0); }

        if (node.nodeName === "BR") { start.setStartBefore(node); } else { start.setStart(node, 0); }
        start.collapse(true);
        at.sel.removeAllRanges();
        at.sel.addRange(start);

      document.execCommand("insertText", false, core.BULLET + " ");
      putCaret(editor, at.index, offset + 2);
    }

  }

  function syncBulletButton() {
    var pressed = false;
    if (document.activeElement === quickEditor) {
      var at = caretLine(quickEditor);

  }
  document.addEventListener("selectionchange", syncBulletButton);

  /* ---------- the add bar ---------- */

  var TYPE_LABEL = { task: "task", event: "event", note: "note" };
  var TYPE_ICON = { task: "j-task", event: "j-event", note: "j-note" };
  var TYPE_NAME = { task: "Task", event: "Event", note: "Note" };
  var PREFIX = { ". ": "task", "o ": "event", "- ": "note" };
  var addBars = {};

  // One add bar. The list it adds to is asked for each time, so it follows the
  // panel (the Month panel's bar adds to whichever day is open).
  function buildAddBar(host, key, listKey) {
    var state = { type: "task", prefixBackup: null };
    var editor = make("div", "editor-line");
    editor.setAttribute("contenteditable", "true");
    editor.setAttribute("role", "textbox");
    editor.setAttribute("aria-label", "New entry");
    editor.setAttribute("data-editor", "single");
    editor.setAttribute("spellcheck", "true");
    editor.setAttribute("lang", "en-GB");
    editor.setAttribute("enterkeyhint", "enter");
    host.appendChild(editor);

    var tools = make("div", "addtools");
    var buttons = {};
    ["task", "event", "note"].forEach(function (type) {
      var b = make("button", "type-button");
      b.type = "button";
      b.setAttribute("aria-label", TYPE_NAME[type]);
      b.setAttribute("aria-pressed", "false");
      b.title = TYPE_NAME[type] + " (Alt+" + (["task", "event", "note"].indexOf(type) + 1) + ")";
      b.setAttribute("aria-keyshortcuts", "Alt+" + (["task", "event", "note"].indexOf(type) + 1));
      b.appendChild(icon(TYPE_ICON[type]));
      b.addEventListener("pointerdown", function (event) { event.preventDefault(); });
      b.addEventListener("click", function () { setType(type); editor.focus(); });
      buttons[type] = b;
      tools.appendChild(b);
    });
    tools.appendChild(make("span", "grow"));
    var bold = make("button", "fmt-button fmt-bold");
    bold.type = "button";
    bold.setAttribute("aria-label", "Bold");
    bold.setAttribute("aria-pressed", "false");
    bold.title = "Bold (Ctrl+B)";
    bold.setAttribute("aria-keyshortcuts", "Control+B Meta+B");
    bold.innerHTML = "<b>B</b>";
    var strike = make("button", "fmt-button fmt-strike");
    strike.type = "button";
    strike.setAttribute("aria-label", "Strike-through");
    strike.setAttribute("aria-pressed", "false");
    strike.title = "Strike-through (Ctrl+Shift+X)";
    strike.setAttribute("aria-keyshortcuts", "Control+Shift+X Meta+Shift+X");
    strike.innerHTML = '<span class="struck">S</span>';
    [bold, strike].forEach(function (b) { b.addEventListener("pointerdown", function (event) { event.preventDefault(); }); });
    bold.addEventListener("click", function () { format("bold", editor); });
    strike.addEventListener("click", function () { format("strikeThrough", editor); });
    tools.appendChild(bold);
    tools.appendChild(strike);
    host.appendChild(tools);

      state.type = type;
      Object.keys(buttons).forEach(function (t) { buttons[t].setAttribute("aria-pressed", t === type ? "true" : "false"); });
      editor.setAttribute("data-placeholder", "Add " + (type === "event" ? "an " : "a ") + TYPE_LABEL[type]);
    }

    wireEditor(editor);

    // A prefix typed on an empty line sets the type and is eaten. Backspace right
    // after it gives the characters back, so a line that really starts with "o"
    // is never lost.
    editor.addEventListener("input", function () {
      var text = readEditor(editor);
      if (PREFIX[text] && state.prefixBackup === null) {

        setType(PREFIX[text]);

        state.prefixBackup = null;
      }
    });

    editor.addEventListener("keydown", function (event) {
      if (event.altKey && !event.ctrlKey && !event.metaKey) {
        var digit = { Digit1: "task", Digit2: "event", Digit3: "note" }[event.code];

      }

        event.preventDefault();

        // browser collapsing a trailing space.

        state.prefixBackup = null;

        range.selectNodeContents(editor);
        range.collapse(false);
        var selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        return;
      }
