<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Private notes</title>
<link rel="icon" href="/logo-stone.svg" type="image/svg+xml">
<script id="theme-init">
(function () {
  try {
    var saved = localStorage.getItem("silurian-notes-theme");
    if (saved === "light" || saved === "dark") { document.documentElement.setAttribute("data-theme", saved); }
  } catch (e) { /* storage is blocked: the page follows the device */ }
})();
</script>
<link rel="stylesheet" href="/tokens.css">
<style>
  /* Light theme and page sizes. The only place a colour or a font size is written. */
  :root {
    color-scheme: light dark;
    --notes-ground: #faf8f5;
    --notes-panel: #f1ede7;
    --notes-field: #ffffff;
    --notes-line: #e2dcd3;
    --notes-line-soft: #ebe6df;
    --notes-hover: #ede8e1;
    --notes-ink: #2f2d2b;
    --notes-strong: #1a1918;
    --notes-muted: #66615f;
    --notes-icon: #4a4744;
    --notes-accent: #ec6917;
    --notes-on-accent: #1a1918;
    --notes-good: #356b46;
    --notes-warn: #9a5a12;
    --notes-bad: #a52a1f;

    --notes-size-12: 12px;
    --notes-size-13: 13px;
    --notes-size-14: 14px;
    --notes-size-15: 15px;
    --notes-size-18: 18px;
    --notes-size-30: 30px;
  }
  :root[data-theme="light"] { color-scheme: light; }

  /* Dark theme, following the device when no choice is saved. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --notes-ground: #262422;
      --notes-panel: #1f1d1c;
      --notes-field: #262422;
      --notes-line: #3a3735;
      --notes-line-soft: #33302e;
      --notes-hover: #302d2b;
      --notes-ink: #e3dfdd;
      --notes-strong: #f5f2ef;
      --notes-muted: #9f9893;
      --notes-icon: #cfcac6;
      --notes-accent: #ec6917;
      --notes-on-accent: #1a1918;
      --notes-good: #6fbf86;
      --notes-warn: #e8a54b;
      --notes-bad: #f0857a;
    }
  }

  /* Dark theme, chosen with the switch. Same values as the block above. */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --notes-ground: #262422;
    --notes-panel: #1f1d1c;
    --notes-field: #262422;
    --notes-line: #3a3735;
    --notes-line-soft: #33302e;
    --notes-hover: #302d2b;
    --notes-ink: #e3dfdd;
    --notes-strong: #f5f2ef;
    --notes-muted: #9f9893;
    --notes-icon: #cfcac6;
    --notes-accent: #ec6917;
    --notes-on-accent: #1a1918;
    --notes-good: #6fbf86;
    --notes-warn: #e8a54b;
    --notes-bad: #f0857a;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--notes-ground);
    color: var(--notes-ink);
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: var(--notes-size-15);
    line-height: 1.5;
  }

  .icon {
    display: block;
    width: 20px;
    height: 20px;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  .bar {
    background: var(--notes-panel);
    border-bottom: 1px solid var(--notes-line-soft);
  }
  .bar-inner, main {
    width: min(960px, 100%);
    margin: 0 auto;
    padding-left: 16px;
    padding-right: 16px;
  }
  .bar-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px 16px;
    flex-wrap: wrap;
    padding-top: 10px;
    padding-bottom: 10px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .mark { display: block; width: 26px; height: auto; aspect-ratio: 200 / 290; }
  .wordmark {
    margin: 0;
    font-family: "Archivo", system-ui, sans-serif;
    font-size: var(--notes-size-18);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--notes-strong);
  }
  .bar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  main { padding-top: 24px; padding-bottom: 48px; }

  h1 {
    margin: 0 0 16px;
    font-size: var(--notes-size-30);
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: var(--notes-strong);
  }
  .lead { margin: 0 0 16px; color: var(--notes-muted); }

  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .row.spread { justify-content: space-between; }
  .form-actions { margin-top: 14px; }

  button {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 44px;
    padding: 8px 16px;
    border: 1px solid var(--notes-line);
    border-radius: 8px;
    background: var(--notes-ground);
    color: var(--notes-ink);
    font: inherit;
    font-size: var(--notes-size-14);
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--notes-hover); }
  button.primary {
    border: 0;
    background: var(--notes-accent);
    color: var(--notes-on-accent);
  }
  button.primary:hover { background: var(--notes-accent); filter: brightness(0.92); }
  button.icon-button {
    width: 44px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--notes-icon);
  }
  button.icon-button:hover { background: var(--notes-hover); }
  button.row-delete:hover, button.row-delete:focus-visible { color: var(--notes-bad); }
  button.quiet-delete:hover, button.quiet-delete:focus-visible { color: var(--notes-bad); }
  button.confirm-yes {
    border: 1px solid var(--notes-bad);
    background: var(--notes-ground);
    color: var(--notes-bad);
  }
  button.confirm-yes:hover { background: var(--notes-hover); }
  button:disabled { cursor: default; opacity: 0.55; }

  button:focus-visible, input:focus-visible, textarea:focus-visible, .note-link:focus-visible {
    outline: 2px solid var(--notes-accent);
    outline-offset: 2px;
  }

  /* One icon at a time in the theme switch: the moon on a light page, the sun on a dark one. */
  .theme-switch .icon-sun { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .theme-switch .icon-sun { display: block; }
    :root:not([data-theme="light"]) .theme-switch .icon-moon { display: none; }
  }
  :root[data-theme="dark"] .theme-switch .icon-sun { display: block; }
  :root[data-theme="dark"] .theme-switch .icon-moon { display: none; }

  label {
    display: block;
    margin-bottom: 6px;
    font-size: var(--notes-size-12);
    font-weight: 600;
    color: var(--notes-muted);
  }
  input[type="password"], input[type="search"] {
    appearance: none;
    width: 100%;
    min-height: 44px;
    padding: 8px 12px;
    border: 1px solid var(--notes-line);
    border-radius: 8px;
    background: var(--notes-field);
    color: var(--notes-ink);
    font: inherit;
  }
  input::placeholder { color: var(--notes-muted); opacity: 1; }

  .search-field { position: relative; }
  .search-field .icon {
    position: absolute;
    top: 12px;
    left: 12px;
    color: var(--notes-muted);
    pointer-events: none;
  }
  .search-field input { padding-left: 40px; }
  .search { margin-bottom: 8px; }

  .panel {
    padding: 24px;
    border: 1px solid var(--notes-line);
    border-radius: 8px;
    background: var(--notes-panel);
  }
  #login .panel { max-width: 380px; }
  .message {
    margin: 0 0 16px;
    font-weight: 600;
    color: var(--notes-bad);
  }

  .notes { list-style: none; margin: 16px 0 0; padding: 0; }
  .notes li { margin-bottom: 2px; }
  .note-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-radius: 8px;
  }
  .note-row:hover { background: var(--notes-hover); }
  .note-row .row-delete { margin: -8px -6px -8px 0; }
  .note-row .note-link { flex: 1; min-width: 0; }
  .notes .confirm { margin: 4px 0 8px; }
  .note-row-message { margin: 4px 12px 8px; }
  .note-main { display: flex; flex-direction: column; min-width: 0; }
  .note-line {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: var(--notes-size-13);
    color: var(--notes-muted);
  }
  .note-link {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    border-radius: 8px;
    color: var(--notes-ink);
    text-decoration: none;
  }
  .note-title {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: var(--notes-size-14);
    font-weight: 700;
    color: var(--notes-strong);
  }
  .note-when {
    flex: none;
    text-align: right;
    font-size: var(--notes-size-12);
    font-variant-numeric: tabular-nums;
    color: var(--notes-muted);
  }
  .empty {
    margin: 16px 0 0;
    padding: 16px;
    border: 1px solid var(--notes-line);
    border-radius: 8px;
    background: var(--notes-panel);
  }

  .toolbar {
    padding-bottom: 12px;
    border-bottom: 1px solid var(--notes-line-soft);
  }
  .editor {
    display: block;
    width: 100%;
    min-height: 60vh;
    margin-top: 12px;
    padding: 16px;
    border: 0;
    border-radius: 8px;
    background: var(--notes-ground);
    color: var(--notes-ink);
    /* The one place on this site that is not Archivo or system UI type. The box
       holds scripts, and a script only reads right in a fixed-width face. */
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: var(--notes-size-15);
    line-height: 1.5;
    tab-size: 2;
    resize: vertical;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: var(--notes-size-12);
    color: var(--notes-muted);
  }
  .status::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 6px;
    background: var(--notes-muted);
  }
  .status[data-state="saved"]::before { background: var(--notes-good); }
  .status[data-state="saving"]::before { background: var(--notes-muted); }
  .status[data-state="unsaved"]::before { background: var(--notes-warn); }
  .status[data-state="failed"]::before { background: var(--notes-bad); }
  .detail { margin: 8px 0 0; min-height: 1.5em; font-size: var(--notes-size-13); color: var(--notes-muted); }

  .confirm {
    margin-top: 12px;
    padding: 12px 16px;
    border-radius: 8px;
    background: var(--notes-panel);
  }
  .confirm p { margin: 0 0 8px; font-weight: 600; }

  @media (max-width: 520px) {
    .note-link { flex-direction: column; align-items: stretch; gap: 2px; }
    .note-when { text-align: left; }
    .panel { padding: 16px; }
  }
</style>
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-bin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
</svg>
<header class="bar">
  <div class="bar-inner">
    <div class="brand">
      <img class="mark" src="/logo-stone.svg" alt="">
      <p class="wordmark">Silurian Notes</p>
    </div>
    <div class="bar-right">
      <button type="button" class="icon-button theme-switch" id="theme-switch" aria-label="Switch to dark mode">
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false"><use href="#i-moon"></use></svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false"><use href="#i-sun"></use></svg>
      </button>
      <div class="row" id="bar-actions" hidden>
        <button type="button" class="primary" id="new-note"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false"><use href="#i-plus"></use></svg>New note</button>
        <button type="button" id="sign-out">Sign out</button>
      </div>
    </div>
  </div>
</header>

<main>
  <p id="boot" class="lead">Loading.</p>

  <section id="login" hidden aria-labelledby="login-heading">
    <h1 id="login-heading">Private notes</h1>
    <div class="panel">
      <p id="login-error" class="message" role="alert" hidden></p>
      <form id="login-form">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <div class="row form-actions">
          <button type="submit" class="primary" id="login-submit">Enter</button>
        </div>
      </form>
    </div>
  </section>

  <section id="list" hidden aria-labelledby="list-heading">
    <h1 id="list-heading">Notes</h1>
    <p id="list-error" class="message" role="alert" hidden></p>
    <div class="search">
      <label for="search" class="sr-only">Search</label>
      <div class="search-field">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false"><use href="#i-search"></use></svg>
        <input id="search" type="search" placeholder="Search notes" maxlength="200" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
    </div>
    <ul class="notes" id="notes"></ul>
    <p class="empty" id="empty" role="status" hidden>No notes yet. Press New note to write the first one.</p>
  </section>

  <section id="edit" hidden aria-label="Edit note">
    <div class="row spread toolbar">
      <div class="row">
        <button type="button" id="back"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false"><use href="#i-chevron-left"></use></svg>All notes</button>
        <span class="status" id="status" role="status" aria-live="polite" data-state="saved">Saved</span>
      </div>
      <div class="row">
        <button type="button" id="copy">Copy</button>
        <button type="button" class="quiet-delete" id="delete">Delete</button>
      </div>
    </div>
    <p class="detail" id="detail"></p>
    <div class="confirm" id="confirm" hidden>
      <p>Delete this note? This cannot be undone.</p>
      <div class="row">
        <button type="button" class="confirm-yes" id="confirm-delete">Delete note</button>
        <button type="button" id="keep">Keep</button>
      </div>
    </div>
    <textarea id="text" class="editor" aria-label="Note text" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
  </section>
</main>

<script id="theme-switch-script">
(function () {
  "use strict";

  var KEY = "silurian-notes-theme";
  var root = document.documentElement;
  var button = document.getElementById("theme-switch");
  var query = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

  function current() {
    var chosen = root.getAttribute("data-theme");
    if (chosen === "light" || chosen === "dark") { return chosen; }
    return query && query.matches ? "dark" : "light";
  }

  function paint() {
    button.setAttribute("aria-label", current() === "dark" ? "Switch to light mode" : "Switch to dark mode");
  }

  button.addEventListener("click", function () {
    var next = current() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    // The choice is remembered on this device only. If storage is blocked the
    // switch still works for this visit.
    try { localStorage.setItem(KEY, next); } catch (e) { /* not saved */ }
    paint();
  });

  if (query && query.addEventListener) { query.addEventListener("change", paint); }
  paint();
})();
</script>
<script>
(function () {
  "use strict";

  var MAX_BYTES = 1024 * 1024;
  var SAVE_DELAY_MS = 1000;
  var RETRY_DELAY_MS = 5000;
  var TOO_LARGE = "This note is over 1 MB, so it cannot be saved. Cut it down and it will save.";
  var NOT_DELETED = "Could not delete this note. Nothing was changed. Try again.";
  var EMPTY_LIST = "No notes yet. Press New note to write the first one.";
  var SEARCH_DELAY_MS = 250;

  var $ = function (id) { return document.getElementById(id); };
  var views = { login: $("login"), list: $("list"), edit: $("edit") };
  var textBox = $("text");
  var statusEl = $("status");
  var detailEl = $("detail");

  var note = { id: null, version: null, saved: "", timer: null, retry: null, saving: false, failed: false, tooLarge: false, conflict: null };
  var currentView = null;

  // The only way a view is painted. The list and the editor are shown only by
  // code that has just had a good answer from the server for them, so nothing of
  // the notes screen, not even its empty layout, appears before the session is
  // confirmed.
  function show(name) {
    currentView = name;
    $("boot").hidden = true;
    Object.keys(views).forEach(function (key) { views[key].hidden = key !== name; });
    $("bar-actions").hidden = name === "login";
  }

  // Nothing but the wordmark and one line of text.
  function showOnly(message) {
    currentView = null;
    Object.keys(views).forEach(function (key) { views[key].hidden = true; });
    $("bar-actions").hidden = true;
    $("boot").textContent = message;
    $("boot").hidden = false;
  }

  // Each navigation gets a number, so a slow answer for an earlier one cannot
  // paint over a later one.
  var routeSeq = 0;

  function setStatus(state, word, detail) {
    statusEl.dataset.state = state;
    statusEl.textContent = word;
    detailEl.textContent = detail || "";
  }

  function byteLength(text) { return new TextEncoder().encode(text).length; }

  function isDirty() { return textBox.value !== note.saved; }
  function hasUnsavedWork() { return note.saving || note.failed || note.tooLarge || note.conflict !== null || isDirty() && !(note.id === null && textBox.value === ""); }

  function request(path, options) {
    options = options || {};
    options.credentials = "same-origin";
    return fetch(path, options).then(function (response) {
      if (response.status === 401 && path !== "/api/login") { goToLogin(); }
      return response;
    });
  }

  function goToLogin() {
    clearTimers();
    clearTimeout(searchTimer);
    searchSeq += 1;
    show("login");
    $("password").value = "";
    $("password").focus();
  }

  function clearTimers() {
    clearTimeout(note.timer); note.timer = null;
    clearTimeout(note.retry); note.retry = null;
  }

  /* ---------- sign in ---------- */

  $("login-form").addEventListener("submit", function (event) {
    event.preventDefault();
    var button = $("login-submit");
    var errorEl = $("login-error");
    button.disabled = true;
    errorEl.hidden = true;
    request("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: $("password").value })
    }).then(function (response) {
      button.disabled = false;
      if (response.ok) { $("password").value = ""; route(); return; }
      errorEl.textContent = "That password is incorrect.";
      errorEl.hidden = false;
      $("password").select();
    }).catch(function () {
      button.disabled = false;
      errorEl.textContent = "Could not reach the server. Try again.";
      errorEl.hidden = false;
    });
  });

  /* ---------- list ---------- */

  function whenText(iso) {
    var date = new Date(iso);
    if (isNaN(date.getTime())) { return ""; }
    return date.toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
  }

  var searchTimer = null;
  var searchSeq = 0;

  function closeRowConfirms() {
    Array.prototype.forEach.call($("notes").querySelectorAll(".confirm"), function (el) { el.hidden = true; });
  }

  function noteRow(item) {
    var li = document.createElement("li");
    var row = document.createElement("div");
    row.className = "note-row";
    var link = document.createElement("a");
    link.className = "note-link";
    link.href = "#n/" + item.id;
    var main = document.createElement("span");
    main.className = "note-main";
    var title = document.createElement("span");
    title.className = "note-title";
    title.textContent = item.title;
    main.appendChild(title);
    if (typeof item.line === "string") {
      var line = document.createElement("span");
      line.className = "note-line";
      line.textContent = item.line;
      main.appendChild(line);
    }
    var when = document.createElement("time");
    when.className = "note-when";
    when.dateTime = item.updatedAt;
    when.textContent = whenText(item.updatedAt);
    link.appendChild(main);
    link.appendChild(when);
    var remove = document.createElement("button");
    remove.type = "button";
    remove.className = "icon-button row-delete";
    remove.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false"><use href="#i-bin"></use></svg>';
    remove.title = "Delete note";
    remove.setAttribute("aria-label", "Delete note: " + item.title);
    row.appendChild(link);
    row.appendChild(remove);

    // The same confirmation step as the edit view.
    var confirmBox = document.createElement("div");
    confirmBox.className = "confirm";
    confirmBox.hidden = true;
    var ask = document.createElement("p");
    ask.textContent = "Delete this note? This cannot be undone.";
    var buttons = document.createElement("div");
    buttons.className = "row";
    var yes = document.createElement("button");
    yes.type = "button";
    yes.className = "confirm-yes";
    yes.textContent = "Delete note";
    var keep = document.createElement("button");
    keep.type = "button";
    keep.textContent = "Keep";
    buttons.appendChild(yes);
    buttons.appendChild(keep);
    confirmBox.appendChild(ask);
    confirmBox.appendChild(buttons);

    var message = document.createElement("p");
    message.className = "message note-row-message";
    message.setAttribute("role", "alert");
    message.hidden = true;

    remove.addEventListener("click", function () {
      closeRowConfirms();
      message.hidden = true;
      confirmBox.hidden = false;
      yes.focus();
    });
    keep.addEventListener("click", function () { confirmBox.hidden = true; remove.focus(); });
    yes.addEventListener("click", function () {
      yes.disabled = keep.disabled = true;
      request("/api/note?id=" + encodeURIComponent(item.id), { method: "DELETE" }).then(function (response) {
        if (!response.ok) { throw new Error("delete"); }
        li.remove();
        if ($("notes").children.length === 0) { showEmpty(currentQuery()); }
      }).catch(function () {
        if (currentView === "login") { return; }
        // The row stays and says so.
        yes.disabled = keep.disabled = false;
        confirmBox.hidden = true;
        message.textContent = NOT_DELETED;
        message.hidden = false;
      });
    });

    li.appendChild(row);
    li.appendChild(confirmBox);
    li.appendChild(message);
    return li;
  }

  function currentQuery() {
    var value = $("search").value;
    return value.trim() === "" ? "" : value;
  }

  function showEmpty(query) {
    var empty = $("empty");
    empty.textContent = query === "" ? EMPTY_LIST : "No notes contain " + query;
    empty.hidden = false;
  }

  // reveal: this load is a navigation to the list, so the list is shown only
  // once the server has answered. Without it, the load refreshes a list that is
  // already on screen, as search does.
  function loadList(reveal) {
    var query = currentQuery();
    var seq = ++searchSeq;
    var navigation = routeSeq;
    var errorEl = $("list-error");
    var options = query === "" ? {} : { headers: { "X-Note-Search": encodeURIComponent(query) } };
    request("/api/notes", options).then(function (response) {
      if (!response.ok) {
        return response.json().then(function (data) { throw new Error(data && data.error || "list"); }, function () { throw new Error("list"); });
      }
      return response.json();
    }).then(function (data) {
      // A slower answer to an older search must not replace a newer one.
      if (seq !== searchSeq) { return; }
      if (reveal) {
        if (navigation !== routeSeq) { return; }
        show("list");
      } else if (currentView !== "list") { return; }
      errorEl.hidden = true;
      var listEl = $("notes");
      listEl.textContent = "";
      data.notes.forEach(function (item) { listEl.appendChild(noteRow(item)); });
      if (data.notes.length === 0) { showEmpty(query); } else { $("empty").hidden = true; }
    }).catch(function (error) {
      if (seq !== searchSeq || currentView === "login") { return; }
      if (currentView !== "list") {
        if (reveal && navigation === routeSeq) { showOnly("Could not load your notes. Check your connection and reload."); }
        return;
      }
      errorEl.textContent = query === "" ? "Could not load your notes. Check your connection and reload."
        : (error && error.message && error.message !== "list" ? error.message : "Could not search your notes. Check your connection and try again.");
      errorEl.hidden = false;
    });
  }

  function showList() {
    $("list-error").hidden = true;
    loadList(true);
  }

  $("search").addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(loadList, SEARCH_DELAY_MS);
  });

  /* ---------- edit and autosave ---------- */

  function openEditor(id, text, version) {
    clearTimers();
    note = { id: id, version: version || null, saved: text, timer: null, retry: null, saving: false, failed: false, tooLarge: false, conflict: null };
    textBox.value = text;
    // A textarea normalises line breaks, so what it holds is the baseline.
    note.saved = textBox.value;
    $("confirm").hidden = true;
    $("copy").textContent = "Copy";
    setStatus("saved", "Saved", id === null ? "Nothing is saved until you type." : "");
    show("edit");
    textBox.focus();
  }

  // The editor is shown only once the note has arrived. Until then whatever was
  // on screen stays, which after sign out is the sign-in screen.
  function openNote(id) {
    var navigation = routeSeq;
    request("/api/note?id=" + encodeURIComponent(id)).then(function (response) {
      if (!response.ok) { throw new Error("open"); }
      var version = response.headers.get("X-Note-Updated");
      return response.arrayBuffer().then(function (buffer) { return { buffer: buffer, version: version }; });
    }).then(function (loaded) {
      if (navigation !== routeSeq) { return; }
      openEditor(id, new TextDecoder("utf-8", { ignoreBOM: true }).decode(loaded.buffer), loaded.version);
    }).catch(function () {
      // A 401 has already gone to sign in. Anything else goes to the list.
      if (navigation !== routeSeq || currentView === "login") { return; }
      location.hash = "";
    });
  }

  // A new, empty note has nothing to fetch, so ask the server first.
  function openNewNote() {
    var navigation = routeSeq;
    request("/api/session").then(function (response) {
      if (navigation !== routeSeq || !response.ok) { return; }
      openEditor(null, "");
    }).catch(function () {
      if (navigation === routeSeq && currentView !== "list" && currentView !== "edit") { showOnly("Could not reach the server. Reload to try again."); }
    });
  }

  textBox.addEventListener("input", function () {
    if (note.conflict !== null) {
      // The note moved on elsewhere. Keep the words on screen and stop trying.
      setStatus("failed", "Not saved", note.conflict);
      return;
    }
    note.failed = false;
    clearTimeout(note.retry);
    if (byteLength(textBox.value) > MAX_BYTES) {
      note.tooLarge = true;
      clearTimeout(note.timer);
      setStatus("failed", "Not saved", TOO_LARGE);
      return;
    }
    note.tooLarge = false;
    setStatus("unsaved", "Not saved", "");
    clearTimeout(note.timer);
    note.timer = setTimeout(save, SAVE_DELAY_MS);
  });

  function save() {
    clearTimeout(note.timer); note.timer = null;
    if (note.saving || note.conflict !== null) { return Promise.resolve(false); }
    var body = textBox.value;
    if (body === note.saved || (note.id === null && body === "")) {
      setStatus("saved", "Saved", "");
      return Promise.resolve(true);
    }
    if (byteLength(body) > MAX_BYTES) { return Promise.resolve(false); }
    note.saving = true;
    setStatus("saving", "Saving", "");
    var creating = note.id === null;
    var path = creating ? "/api/notes" : "/api/note?id=" + encodeURIComponent(note.id);
    return request(path, {
      method: creating ? "POST" : "PUT",
      headers: creating
        ? { "Content-Type": "text/plain; charset=utf-8" }
        : { "Content-Type": "text/plain; charset=utf-8", "X-Base-Updated": note.version },
      body: body
    }).then(function (response) {
      if (response.status === 409) {
        // Changed or deleted on another device. Nothing was written. Keep the text.
        return response.json().then(function (data) {
          note.saving = false;
          note.failed = false;
          note.conflict = data.error;
          clearTimers();
          setStatus("failed", "Not saved", data.error);
          return false;
        });
      }
      if (response.status === 413) {
        note.saving = false; note.tooLarge = true;
        setStatus("failed", "Not saved", TOO_LARGE);
        return false;
      }
      if (!response.ok) { throw new Error("save"); }
      return response.json().then(function (data) {
        note.saving = false;
        note.failed = false;
        note.saved = body;
        note.version = data.updatedAt;
        if (creating) {
          note.id = data.id;
          history.replaceState(null, "", "#n/" + data.id);
          lastHash = location.hash;
        }
        if (textBox.value !== body) {
          setStatus("unsaved", "Not saved", "");
          note.timer = setTimeout(save, SAVE_DELAY_MS);
          return false;
        }
        setStatus("saved", "Saved", "");
        return true;
      });
    }).catch(function () {
      note.saving = false;
      if (currentView === "login") { return false; }
      note.failed = true;
      setStatus("failed", "Not saved", "Could not reach storage. Trying again in 5 seconds.");
      note.retry = setTimeout(save, RETRY_DELAY_MS);
      return false;
    });
  }

  function settle() {
    // Resolves true when nothing is left unsaved.
    clearTimeout(note.timer);
    if (note.saving) {
      return new Promise(function (resolve) { setTimeout(resolve, 300); }).then(settle);
    }
    return save().then(function (ok) { return ok && !note.tooLarge; });
  }

  function leaveEditor() {
    if (!hasUnsavedWork()) { return Promise.resolve(true); }
    return settle().then(function (ok) {
      if (ok) { return true; }
      return window.confirm("This note has not saved. Leave anyway and lose the unsaved changes?");
    });
  }

  window.addEventListener("beforeunload", function (event) {
    if (currentView === "edit" && hasUnsavedWork()) {
      event.preventDefault();
      event.returnValue = "";
    }
  });

  /* ---------- buttons ---------- */

  $("new-note").addEventListener("click", function () {
    leaveEditor().then(function (ok) {
      if (!ok) { return; }
      // Already on #new there is no hashchange to follow, so start over directly.
      if (location.hash === "#new") { route(); } else { location.hash = "#new"; }
    });
  });

  $("back").addEventListener("click", function () {
    leaveEditor().then(function (ok) { if (ok) { clearTimers(); note.failed = note.tooLarge = false; note.conflict = null; location.hash = ""; } });
  });

  $("copy").addEventListener("click", function () {
    var button = $("copy");
    var text = textBox.value;
    function done(ok) {
      button.textContent = ok ? "Copied" : "Copy failed";
      setTimeout(function () { button.textContent = "Copy"; }, 2000);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
      return;
    }
    textBox.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    done(ok);
  });

  $("delete").addEventListener("click", function () { $("confirm").hidden = false; $("confirm-delete").focus(); });
  $("keep").addEventListener("click", function () { $("confirm").hidden = true; });
  $("confirm-delete").addEventListener("click", function () {
    clearTimers();
    var id = note.id;
    note.saved = textBox.value; note.failed = note.tooLarge = false; note.conflict = null; note.saving = false;
    if (id === null) { location.hash = ""; return; }
    request("/api/note?id=" + encodeURIComponent(id), { method: "DELETE" }).then(function (response) {
      if (!response.ok) { throw new Error("delete"); }
      location.hash = "";
    }).catch(function () {
      if (currentView === "login") { return; }
      $("confirm").hidden = true;
      setStatus("failed", "Not deleted", "Could not delete this note. Nothing was changed. Try again.");
    });
  });

  /* ---------- sign out ---------- */

  // Remove every note from the page, so back, refresh or a restored page shows
  // nothing once signed out.
  function clearContent() {
    clearTimers();
    clearTimeout(searchTimer);
    searchSeq += 1;
    note = { id: null, version: null, saved: "", timer: null, retry: null, saving: false, failed: false, tooLarge: false, conflict: null };
    textBox.value = "";
    $("notes").textContent = "";
    $("search").value = "";
    $("empty").hidden = true;
    $("list-error").hidden = true;
    $("confirm").hidden = true;
    setStatus("saved", "Saved", "");
  }

  // Sign out saves unsaved edits first. If that save fails, is refused as a
  // conflict, or the note is too large, there is no offer to leave anyway: the
  // user stays signed in on the note, with the text and the message on screen.
  function saveBeforeSignOut() {
    if (currentView !== "edit" || !hasUnsavedWork()) { return Promise.resolve(true); }
    return settle();
  }

  $("sign-out").addEventListener("click", function () {
    var button = $("sign-out");
    button.disabled = true;
    saveBeforeSignOut().then(function (ok) {
      if (!ok) { button.disabled = false; return; }
      // Straight to fetch, not request(): a 401 here means already signed out.
      return fetch("/api/session", { method: "DELETE", credentials: "same-origin" }).then(function (response) {
        button.disabled = false;
        if (!response.ok && response.status !== 401) { throw new Error("sign out"); }
        clearContent();
        history.replaceState(null, "", location.pathname);
        lastHash = "";
        goToLogin();
      });
    }).catch(function () {
      button.disabled = false;
      var where = currentView === "edit" ? null : $("list-error");
      if (where) { where.textContent = "Could not sign out. Check your connection and try again."; where.hidden = false; }
      else { setStatus("failed", "Not signed out", "Could not sign out. Check your connection and try again."); }
    });
  });

  // A browser may keep this page in its back-forward cache and show it again on
  // Back exactly as it was left, before any code runs. So the page empties
  // itself as it is left: what the cache keeps holds no note and shows only the
  // wordmark. On return it asks the server before showing anything.
  window.addEventListener("pagehide", function () {
    clearContent();
    showOnly("Loading.");
  });

  window.addEventListener("pageshow", function (event) {
    if (!event.persisted) { return; }
    lastHash = location.hash;
    request("/api/session").then(function (response) {
      if (response.ok) { route(); } else { goToLogin(); }
    }).catch(function () {
      showOnly("Could not reach the server. Reload to try again.");
    });
  });

  /* ---------- routing ---------- */

  var lastHash = location.hash;

  function route() {
    routeSeq += 1;
    var hash = location.hash;
    var match = /^#n\/([0-9a-f]{32})$/.exec(hash);
    if (match) { openNote(match[1]); }
    else if (hash === "#new") { openNewNote(); }
    else { showList(); }
  }

  window.addEventListener("hashchange", function () {
    var target = location.hash;
    if (currentView === "edit" && hasUnsavedWork() && target !== lastHash) {
      // The browser back button must not drop unsaved work.
      var wanted = target;
      leaveEditor().then(function (ok) {
        if (ok) { note.failed = note.tooLarge = false; note.conflict = null; lastHash = wanted; route(); }
        else { history.replaceState(null, "", lastHash || "#"); }
      });
      return;
    }
    lastHash = target;
    route();
  });

  request("/api/session").then(function (response) {
    if (response.ok) { route(); } else { goToLogin(); }
  }).catch(function () {
    $("boot").textContent = "Could not reach the server. Reload to try again.";
  });
})();
</script>
</body>
</html>
